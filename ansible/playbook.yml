---
# Homelab infrastructure and secrets management playbook
#
# Usage:
#   Full setup:       ansible-playbook ansible/playbook.yml
#   Secrets only:     ansible-playbook ansible/playbook.yml --tags secrets
#   Infra (all):      ansible-playbook ansible/playbook.yml --tags infra
#
# Bootstrap (one-time manual steps on new VM):
#   1. SSH into new VM via console or temporary key
#   2. curl -fsSL https://tailscale.com/install.sh | sh
#   3. sudo tailscale up --ssh   (enables Tailscale SSH for keyless access)
#   4. Now run the appropriate playbook tag

# Control plane setup (K3s server)
- name: Setup K3s control plane
  hosts: control
  become: yes

  pre_tasks:
    - name: Verify Tailscale is installed and running
      ansible.builtin.command: tailscale status
      register: tailscale_check
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Fail if Tailscale is not running
      ansible.builtin.fail:
        msg: "Tailscale is not running. Run: curl -fsSL https://tailscale.com/install.sh | sh && sudo tailscale up --ssh"
      when: tailscale_check.rc != 0
      tags: [always]

    - name: Ensure Tailscale SSH is enabled
      ansible.builtin.command: tailscale up --ssh --accept-risk=lose-ssh
      register: tailscale_ssh
      changed_when: "'Success' in tailscale_ssh.stdout or tailscale_ssh.rc == 0"
      failed_when: false
      tags: [always]

    - name: Get Tailscale IP address
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false
      tags: [always]

    - name: Set Tailscale IP as fact
      ansible.builtin.set_fact:
        host_tailscale_ip: "{{ tailscale_ip.stdout }}"
      tags: [always]

    - name: Display Tailscale IP
      ansible.builtin.debug:
        msg: "Using Tailscale IP: {{ host_tailscale_ip }}"
      tags: [always]

  roles:
    # Install and configure K3s with Tailscale binding
    - role: k3s
      tags: [k3s, infra]

    # Setup kubectl access and External Secrets Operator
    - role: k8s-setup
      tags: [k8s, infra]

# Worker node setup (K3s agent)
- name: Setup K3s worker nodes
  hosts: worker
  become: yes

  pre_tasks:
    - name: Verify Tailscale is installed and running
      ansible.builtin.command: tailscale status
      register: tailscale_check
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Fail if Tailscale is not running
      ansible.builtin.fail:
        msg: "Tailscale is not running. Run: curl -fsSL https://tailscale.com/install.sh | sh && sudo tailscale up --ssh"
      when: tailscale_check.rc != 0
      tags: [always]

    - name: Ensure Tailscale SSH is enabled
      ansible.builtin.command: tailscale up --ssh --accept-risk=lose-ssh
      register: tailscale_ssh
      changed_when: "'Success' in tailscale_ssh.stdout or tailscale_ssh.rc == 0"
      failed_when: false
      tags: [always]

    - name: Get Tailscale IP address
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false
      tags: [always]

    - name: Set Tailscale IP as fact
      ansible.builtin.set_fact:
        host_tailscale_ip: "{{ tailscale_ip.stdout }}"
      tags: [always]

    - name: Display Tailscale IP
      ansible.builtin.debug:
        msg: "Using Tailscale IP: {{ host_tailscale_ip }}"
      tags: [always]

  roles:
    - role: k3s-agent
      tags: [k3s-agent, infra]
      vars:
        k3s_server_url: "https://{{ hostvars[groups['control'][0]]['host_tailscale_ip'] | default(k3s_server_ip) }}:6443"
        k3s_node_token: "{{ lookup('env', 'K3S_NODE_TOKEN') }}"

  post_tasks:
    - name: Label worker node
      ansible.builtin.command: >
        k3s kubectl label node {{ inventory_hostname }}
        {% for key, value in node_labels.items() %}
        {{ key }}={{ value }}
        {% endfor %}
        --overwrite
      delegate_to: "{{ groups['control'][0] }}"
      changed_when: true
      when: node_labels is defined
      tags: [k3s-agent, infra]

# Secrets management play
# Runs on localhost to sync Bitwarden secrets to Kubernetes
- name: Sync secrets from Bitwarden to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: no
  tags: [secrets]

  vars:
    # Secret definitions - add new services here
    k8s_secrets:
      # MySQL credentials (consolidated)
      - name: mysql-credentials
        namespace: databases
        data:
          root-password: mysql/root_password

      # PostgreSQL credentials (consolidated)
      - name: postgres-credentials
        namespace: databases
        data:
          root-password: postgres/root_password

      # Firefly III credentials (consolidated)
      # Keys must match the env var names firefly reads, since the chart's
      # Deployment uses envFrom against this Secret.
      - name: firefly-credentials
        namespace: apps
        data:
          APP_KEY: firefly/app_key
          DB_DATABASE: firefly/db_name
          DB_USERNAME: firefly/db_username
          DB_PASSWORD: firefly/db_password

      # Memoet credentials (consolidated)
      - name: memoet-credentials
        namespace: apps
        data:
          db-name: memoet/db_name
          db-username: memoet/db_username
          db-password: memoet/db_password
          secret-key-base: memoet/secret_key_base

      # Snibox credentials (consolidated)
      - name: snibox-credentials
        namespace: apps
        data:
          secret-key-base: snibox/secret_key_base

      # Bookstack credentials (consolidated)
      - name: bookstack-credentials
        namespace: apps
        data:
          db-name: bookstack/db_name
          db-username: bookstack/db_username
          db-password: bookstack/db_password
          app-key: bookstack/app_key

      # Vikunja credentials (consolidated)
      - name: vikunja-credentials
        namespace: apps
        data:
          db-name: vikunja/db_name
          db-username: vikunja/db_username
          db-password: vikunja/db_password
          jwt-secret: vikunja/jwt_secret
          mailer-host: vikunja/mailer_host
          mailer-port: vikunja/mailer_port
          mailer-username: vikunja/mailer_username
          mailer-password: vikunja/mailer_password
          mailer-sender: vikunja/mailer_sender

      # Webtrees credentials (consolidated)
      - name: webtrees-credentials
        namespace: apps
        data:
          db-name: webtrees/db_name
          db-username: webtrees/db_username
          db-password: webtrees/db_password

      # Nextcloud credentials (consolidated)
      - name: nextcloud-credentials
        namespace: apps
        data:
          db-name: nextcloud/db_name
          db-username: nextcloud/db_username
          db-password: nextcloud/db_password

      # Frigate RTSP credentials. Keys are the env var names Frigate looks
      # up at runtime when substituting `{FRIGATE_RTSP_USERNAME}` /
      # `{FRIGATE_RTSP_PASSWORD}` placeholders in cameras[].ffmpeg.inputs[].path.
      # These must match the username/password configured on the camera
      # hardware's own admin UI — Frigate is the consumer, not the source.
      - name: frigate-rtsp-credentials
        namespace: apps
        data:
          FRIGATE_RTSP_USERNAME: frigate/rtsp_username
          FRIGATE_RTSP_PASSWORD: frigate/rtsp_password

      # texas-fold-em credentials (consolidated)
      # broker-key: bearer auth for /token consumers
      # admin-key:  bearer auth for /init and /admin/*
      # firefly-pat: long-lived PAT for the integration's firefly client
      #              (sync, FTS5 indexing, push)
      # llm-api-key: OpenAI-compatible API key for the Tier-3 LLM
      #              classifier. Sourced from deepseek/api_key
      #              (DeepSeek's OpenAI-compatible endpoint); swap the
      #              Bitwarden source to openai/api_key or similar to
      #              repoint at a different provider.
      - name: texas-fold-em-credentials
        namespace: apps
        data:
          broker-key: texas-fold-em/broker_key
          admin-key: texas-fold-em/admin_key
          firefly-pat: firefly/personal_access_token
          llm-api-key: deepseek/api_key

      # tinyauth credentials (replaces authelia)
      # Keys match the env var names tinyauth reads via valueFrom in
      # kubernetes/tinyauth/values.yaml — see env: section there.
      - name: tinyauth-credentials
        namespace: tinyauth
        data:
          GOOGLE_CLIENT_ID: tinyauth/google_client_id
          GOOGLE_CLIENT_SECRET: tinyauth/google_client_secret
          OAUTH_WHITELIST: tinyauth/oauth_whitelist

      # Authelia users database (YAML file)
      - name: authelia-users
        namespace: authelia
        type: notes
        data:
          users_database.yml: authelia/users_database

      # Velero credentials (INI file)
      - name: velero-credentials
        namespace: velero
        type: notes
        data:
          cloud: velero/r2_credentials_file

      # velero-ui passphrase for JWT cookie signing (otwld/velero-ui chart 0.14+)
      - name: velero-ui-credentials
        namespace: velero
        data:
          pass_phrase: velero-ui/pass_phrase

      # Keel credentials (image update UI)
      # Keys must match the env var names Keel reads, since the chart's
      # Deployment uses envFrom against this Secret.
      - name: keel-credentials
        namespace: kube-system
        data:
          BASIC_AUTH_USER: keel/username
          BASIC_AUTH_PASSWORD: keel/password

      # agentfest / festie — the remote computer running Claude Code.
      # Codeman's own login, sitting behind tinyauth rather than instead of it.
      - name: festie-auth
        namespace: apps
        data:
          codeman-password: agentfest/codeman_password

      # SSH identity for the machine. Needed at container start, not just for
      # convenience: dotfiles' claude-skills module clones agent-smith during
      # home-manager activation, so without this the environment comes up
      # incomplete. `notes` because a private key is multi-line.
      #
      # This is a deploy key for the container, deliberately distinct from the
      # laptop's own key — the two should be revocable independently.
      # The two credentials dotfiles reads from fixed paths. `notes` because
      # both are multi-line armored blocks.
      #   personal.pem -> ~/.ssh/keys/personal.pem, which configs/ssh names for
      #     github.com and gitlab.com, so it is what makes git work at all.
      #   private.key  -> ~/.secrets/private.key, which configs/gnupg imports
      #     during activation, which is what lets pass/gopass decrypt.
      - name: festie-secrets
        namespace: apps
        type: notes
        data:
          personal.pem: agentfest/ssh_private_key
          private.key: agentfest/gpg_private_key

  pre_tasks:
    - name: Verify required environment variables
      ansible.builtin.fail:
        msg: "Required environment variable {{ item }} is not set"
      when: lookup('env', item) == ''
      loop:
        - BW_CLIENTID
        - BW_CLIENTSECRET
        - BW_PASSWORD

    - name: Verify Bitwarden CLI is installed
      ansible.builtin.command: bw --version
      register: bw_check
      changed_when: false

    - name: Login and unlock Bitwarden vault
      ansible.builtin.shell: |
        export BW_CLIENTID="{{ lookup('env', 'BW_CLIENTID') }}"
        export BW_CLIENTSECRET="{{ lookup('env', 'BW_CLIENTSECRET') }}"
        export BW_PASSWORD="{{ lookup('env', 'BW_PASSWORD') }}"
        bw logout >/dev/null 2>&1 || true
        bw login --apikey >/dev/null 2>&1
        bw unlock --passwordenv BW_PASSWORD --raw
      register: bw_session
      changed_when: false
      no_log: true

    - name: Set Bitwarden session fact
      ansible.builtin.set_fact:
        BW_SESSION: "{{ bw_session.stdout }}"
      no_log: true

    - name: Ensure required namespaces exist
      ansible.builtin.shell: kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
      loop:
        - databases
        - apps
        - tinyauth
        - velero
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when: false

  tasks:
    # Every value is fetched first, into a private temp dir, and a secret is
    # applied only when ALL of its values arrived non-empty: a failed lookup
    # must never write an empty value over a working secret. One broken
    # lookup skips only its own secret -- the deploy of everything else goes
    # ahead -- and the tasks below (plus the workflow's last step) shout
    # about what was skipped, naming items and Bitwarden's reason, never values.
    - name: Create/Update K8s secrets from Bitwarden
      ansible.builtin.shell: |
        set -o pipefail
        export BW_SESSION="{{ BW_SESSION }}"
        d="$(mktemp -d)"; trap 'rm -rf "$d"' EXIT
        bad=""
        {% for key, bw_path in item.data.items() %}
        if v="$(bw get {{ item.type | default('password') }} '{{ bw_path }}' --session "$BW_SESSION" 2> "$d/.err")" && [ -n "$v" ]; then
          printf '%s' "$v" > "$d/{{ key }}"
        else
          bad="$bad {{ bw_path }} ($(r="$(head -n 1 "$d/.err" | cut -c1-160 | tr -d '\r')"; printf '%s' "${r:-empty value}"))"
        fi
        {% endfor %}
        if [ -n "$bad" ]; then echo "SKIPPED {{ item.name }}:$bad"; exit 3; fi
        kubectl create secret generic {{ item.name }} \
          --namespace={{ item.namespace }} \
          {% for key in item.data.keys() %}
          --from-file={{ key }}="$d/{{ key }}" \
          {% endfor %}
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      loop: "{{ k8s_secrets }}"
      loop_control:
        label: "{{ item.name }}"
      register: secret_result
      changed_when: "'configured' in secret_result.stdout or 'created' in secret_result.stdout"
      failed_when: false
      no_log: true

    - name: Collect the secrets that were not synced (names and reasons only)
      ansible.builtin.set_fact:
        secret_failures: "{{ secret_failures | default([]) + [item.item.name ~ ' — ' ~ ((item.stdout_lines | default([]) | last) if (item.stdout_lines | default([]) | length > 0) else ((item.stderr_lines | default([]) | first) | default('no output'))) | truncate(240)] }}"
      loop: "{{ secret_result.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: (item.rc | default(0)) != 0
      no_log: true

    - name: Leave the list where the workflow's last step can fail on it
      ansible.builtin.copy:
        dest: /tmp/secret-sync-failures.txt
        content: "{{ secret_failures | default([]) | join('\n') }}"
        mode: "0644"

    - name: Display sync results
      ansible.builtin.debug:
        msg: "✓ Synced {{ (k8s_secrets | length) - (secret_failures | default([]) | length) }} of {{ k8s_secrets | length }} secrets to Kubernetes"

    - name: NOT SYNCED — Bitwarden lookups that failed (existing cluster secrets were left untouched)
      ansible.builtin.debug:
        msg: "{{ secret_failures }}"
      when: secret_failures | default([]) | length > 0
