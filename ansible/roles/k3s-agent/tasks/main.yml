---
# Install and configure K3s agent (worker node) with Tailscale binding
# Prerequisites:
#   - host_tailscale_ip must be set in playbook pre_tasks
#   - k3s_server_url and k3s_node_token must be provided
# This role is idempotent and can be run multiple times safely

- name: Check if K3s agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

# INSTALL_K3S_VERSION: the release in group_vars/all.yml. Unpinned, get.k3s.io
# installs its stable channel, which can be newer than the control plane.
- name: Install K3s agent with Tailscale configuration
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | K3S_URL="{{ k3s_server_url }}" \
      K3S_TOKEN="{{ k3s_node_token }}" \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_EXEC="agent \
      --node-ip={{ host_tailscale_ip }} \
      --flannel-iface=tailscale0" sh -
  args:
    executable: /bin/bash
  when: not k3s_binary.stat.exists
  register: k3s_agent_install
  changed_when: k3s_agent_install.rc == 0

# An agent keeps the server URL it was installed with. jomjom's still named the
# address of the control plane it first joined, which is a worker's now; it only
# found the real server through the list in its load-balancer state. Point every
# agent at the current control plane so a restart never depends on that list.
- name: Point the agent at the current control plane
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s-agent.service.env
    regexp: '^K3S_URL='
    line: "K3S_URL='{{ k3s_server_url }}'"
  register: k3s_agent_url
  no_log: true  # the same file holds the join token

- name: Ensure the k3s-agent drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    mode: '0755'

- name: Ensure k3s-agent waits for tailscale0 interface
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/wait-for-tailscale.conf
    content: |
      [Service]
      ExecStartPre=/bin/sh -c 'until ip link show tailscale0 >/dev/null 2>&1; do echo "Waiting for tailscale0..."; sleep 2; done'
    mode: '0644'
  register: k3s_agent_override

- name: Reload systemd if override changed
  ansible.builtin.systemd:
    daemon_reload: yes
  when: k3s_agent_override.changed

- name: Ensure K3s agent service is running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: yes

- name: Restart K3s agent if its override or server URL changed
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when: k3s_agent_override.changed or k3s_agent_url.changed

- name: Display K3s agent installation status
  ansible.builtin.debug:
    msg:
      - "K3s agent installed successfully"
