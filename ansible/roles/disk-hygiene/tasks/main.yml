---
# Disk hygiene for the control-plane host: a daily timer that removes the
# container images no container on the node uses, once they are a few days
# old. Of the regenerable data on this disk, they are the one kind nothing
# else bounds:
# - /tmp and /var/tmp: systemd-tmpfiles clears them (30 days);
# - the journal: journald caps it (10% of the disk, at most 4 GB);
# - rotated logs: logrotate keeps four weeks;
# - finished pods: their CronJobs' history limits;
# - container images: the kubelet removes unused ones only once the disk is
#   85% full, and then only down to 80%. On 24 Nov 2026, 153 of 201 images
#   were unused (15 old agentfest versions alone took ~35 GB), so the disk sat
#   above 80% with a real fill hidden behind them.
# Nothing here deletes files, volumes or logs; images go through the runtime.
# Takes effect live and restarts nothing. Dry run until disk_hygiene_dry_run
# is false. Run it now, or a dry run, with node-maintenance.yml.

- name: jq, which the script reads the runtime's answers with
  ansible.builtin.apt:
    name: jq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: The disk hygiene script
  ansible.builtin.copy:
    src: homelab-disk-hygiene
    dest: /usr/local/sbin/homelab-disk-hygiene
    mode: "0755"

- name: Its settings
  ansible.builtin.copy:
    dest: /etc/default/homelab-disk-hygiene
    mode: "0644"
    content: |
      # Managed by homelab.setup (ansible/roles/disk-hygiene).
      # 1: only log what would be removed.
      DRY_RUN={{ 1 if disk_hygiene_dry_run | bool else 0 }}
      MIN_AGE_DAYS={{ disk_hygiene_min_age_days | int }}
      PAUSE_S={{ disk_hygiene_pause_s | int }}

- name: Its service and daily timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - homelab-disk-hygiene.service
    - homelab-disk-hygiene.timer

- name: Run it daily
  ansible.builtin.systemd:
    name: homelab-disk-hygiene.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Report the mode and the next run
  ansible.builtin.shell: |
    grep -E '^(DRY_RUN|MIN_AGE_DAYS)=' /etc/default/homelab-disk-hygiene
    echo "timer: $(systemctl is-enabled homelab-disk-hygiene.timer) $(systemctl is-active homelab-disk-hygiene.timer); next $(systemctl show homelab-disk-hygiene.timer -p NextElapseUSecRealtime --value)"
  register: disk_hygiene_report
  changed_when: false

- name: Show the report
  ansible.builtin.debug:
    var: disk_hygiene_report.stdout_lines
