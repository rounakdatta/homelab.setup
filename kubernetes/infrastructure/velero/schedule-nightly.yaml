---
# Nightly full backup at 4 AM IST (22:30 UTC)
# Backs up all application namespaces with PVC data using Kopia
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: nightly-full-backup
  namespace: velero
spec:
  # 4 AM IST = 22:30 UTC (previous day)
  schedule: "30 22 * * *"
  template:
    # Include all application namespaces
    includedNamespaces:
      - databases
      - apps
      - authelia
      - cert-manager
    # Exclude noisy resources
    excludedResources:
      - events
      - events.events.k8s.io
      # cert-manager's request/order/challenge objects are regenerable runtime
      # children of Certificates. Backing them up means a DR restore re-seeds
      # stale CertificateRequests that collide with cert-manager's own next
      # revision name (<cert>-N), deadlocking renewals on "already exists" until
      # the certs silently expire. This bit us on 2026-06: 2026-03-30 leftovers
      # (restored during the March DR) blocked renewals for 8 apps. The *-tls
      # Secrets and Certificates ARE still backed up, so a restore reuses the
      # existing cert material (no re-issuance / Let's Encrypt rate-limit risk).
      - certificaterequests.cert-manager.io
      - orders.acme.cert-manager.io
      - challenges.acme.cert-manager.io
    # Use file-level backup for all PVCs (via Kopia)
    defaultVolumesToFsBackup: true
    # 90-day retention. Widened from 30d (720h) after the 2026-07-29 outage: the
    # cluster was down ~23h before anyone noticed, and a 30-day window leaves
    # little room to reach back past a problem that went unspotted for a while.
    # A TTL is kept rather than dropped so R2 storage stays bounded -- expiry is
    # the one deliberate exception to the "never auto-delete data" invariant
    # enforced in .github/workflows/deploy-stuff.yml, because unbounded backup
    # growth has a real cost.
    ttl: 2160h
    # Use the default (R2) storage location
    storageLocation: default
    # Include cluster-scoped resources (ClusterIssuers, etc.)
    includeClusterResources: true
