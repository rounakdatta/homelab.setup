---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Velero install is rendered from the upstream Helm chart at deploy time.
# Requires `kubectl kustomize --enable-helm` (or standalone kustomize with --enable-helm).
helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 11.2.0
    releaseName: velero
    namespace: velero
    valuesFile: values.yaml

resources:
  - namespace.yaml
  - crds.yaml  # Velero CRDs v1.17.1 (vendored; chart's upgrade-CRDs job is disabled)
  - backup-storage-location.yaml
  - schedule-nightly.yaml
  - velero-ui.yaml
  - velero-ui-ingress.yaml
