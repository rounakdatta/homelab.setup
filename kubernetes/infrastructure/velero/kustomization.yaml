---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Velero install + CRDs are rendered from the upstream Helm chart at deploy time.
# `includeCRDs: true` pulls in the chart's bundled CRDs so version bumps stay
# fully hands-off — chart and CRDs always move together.
# Requires `kubectl kustomize --enable-helm` (or standalone kustomize with --enable-helm).
helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 11.2.0
    releaseName: velero
    namespace: velero
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - backup-storage-location.yaml
  - schedule-nightly.yaml
  - velero-ui.yaml
  - velero-ui-ingress.yaml
