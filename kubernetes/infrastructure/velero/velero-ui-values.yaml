# Values for the otwld/velero-ui Helm chart 0.14.0 (app v0.10.0).
# Replaces the previous hand-rolled velero-ui.yaml.
# Chart docs: https://velero-ui.docs.otwld.com/

image:
  repository: otwld/velero-ui
  # Empty tag falls back to chart's appVersion (0.10.0). Pinning at the
  # chart layer is enough — bumping the chart bumps the image together.
  tag: ""
  pullPolicy: IfNotPresent

configuration:
  logLevel: info
  general:
    veleroNamespace: velero
    # JWT-signing passphrase for the v0.10+ web UI session cookies.
    # Synced from Bitwarden by ansible into the velero-ui-credentials Secret;
    # the chart references it via existingSecret here, and we plumb it as
    # AUTH_SECRET_PASSPHRASE via `env:` below since the chart doesn't auto-wire it.
    secretPassPhrase:
      useSecret: true
      existingSecret: velero-ui-credentials
      key: pass_phrase

# Chart 0.14.0's deployment template doesn't auto-inject AUTH_SECRET_PASSPHRASE
# from the secret it references; we plumb it manually here.
env:
  - name: AUTH_SECRET_PASSPHRASE
    valueFrom:
      secretKeyRef:
        name: velero-ui-credentials
        key: pass_phrase

# NOT cluster-admin. A backup dashboard has no business holding write access to
# every resource in the cluster — including read of every Secret, which is the
# whole point of the 2026-09 hardening pass. With clusterAdministrator: false the
# chart binds its own scoped roles instead (velero-ui-permissions +
# velero-ui-velero-permissions), which cover listing/among the velero resources
# and the namespaces the UI displays. If the UI later reports it cannot see some
# resource, widen those chart roles — never flip this back to cluster-admin.
# (velero-server itself still runs cluster-admin: that is the backup ENGINE and
# reducing it risks the backups, so it is deliberately out of scope here.)
rbac:
  create: true
  clusterAdministrator: false

service:
  type: ClusterIP
  port: 3000

# We keep our standalone velero-ui-ingress.yaml (with tinyauth + cert-manager)
ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
