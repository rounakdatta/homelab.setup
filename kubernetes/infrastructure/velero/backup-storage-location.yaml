---
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
spec:
  credential:
    name: velero-credentials
    key: cloud
  provider: aws
  accessMode: ReadWrite
  default: true
  objectStorage:
    bucket: homelab-sweet-homelab
    # `velero-enc`, not the original `velero`, since 2026-09-29.
    #
    # Kopia encrypts every repository with the password in
    # velero-repo-credentials (Bitwarden velero/repository_password), and
    # Velero cannot change the password of a repository that already exists.
    # The repositories under `velero/` were created with Velero's public
    # default (static-passw0rd), so adopting a real password meant fresh
    # repositories under a new prefix. NEVER change the password again without
    # also moving to a new prefix -- the old repositories would stop opening.
    #
    # Everything before 2026-09-29 sat under `velero/`, behind that public
    # default password. It was purged from 2026-11-18 by a one-day R2 lifecycle
    # rule (prefix `velero/` -- with the slash, so `velero-enc/` never matches),
    # after a restore drill passed and every backup under `velero-enc` had
    # Completed. There is no restore point older than 2026-09-29.
    prefix: velero-enc
  config:
    region: auto
    s3ForcePathStyle: "true"
    s3Url: https://399b29c5fa49ceb55728ba787d3d1e8a.r2.cloudflarestorage.com
