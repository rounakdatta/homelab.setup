---
# Let's Encrypt Production ClusterIssuer
# This creates a cluster-wide certificate issuer that all ingresses can use
#
# DNS-01 through Cloudflare, not HTTP-01. Most hostnames are tailnet-only:
# their A records hold the control plane's Tailscale address, which Let's
# Encrypt cannot reach, so an HTTP-01 challenge for them can never complete.
# DNS-01 proves control of the name with a TXT record instead, so it works the
# same for a tailnet-only host and a public one, and nothing needs port 80.
#
# The token (Secret cloudflare-api-token, synced from the Bitwarden item
# cloudflare/dns_api_token by ansible/playbook.yml) needs Zone:DNS:Edit and
# Zone:Zone:Read on every zone a certificate names -- today taptappers.club and
# itineris.world. It can rewrite those zones, so scope it to them and nothing
# else. A ClusterIssuer reads it from cert-manager's own namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email for ACME registration and recovery contact
    # IMPORTANT: Update this to your email
    email: rounakdatta12@gmail.com

    # Secret to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token

---
# Let's Encrypt Staging ClusterIssuer (for testing)
# Use this for testing to avoid rate limits
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Let's Encrypt staging server (for testing)
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    email: rounakdatta12@gmail.com

    privateKeySecretRef:
      name: letsencrypt-staging-account-key

    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
