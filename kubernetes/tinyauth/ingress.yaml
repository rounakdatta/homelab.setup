---
# tinyauth claims auth.taptappers.club (replacing authelia at the same URL).
# The old authelia ingress is removed in the same commit so Traefik
# routes the host unambiguously.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tinyauth
  namespace: tinyauth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
  - host: auth.taptappers.club
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tinyauth
            port:
              number: 3000
  tls:
  - hosts:
    - auth.taptappers.club
    secretName: tinyauth-tls-secret
