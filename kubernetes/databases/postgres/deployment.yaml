apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: databases
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: databases
  labels:
    app: postgres
spec:
  replicas: 1
  # Never two at once: a rolling update would start a second postgres on the same data directory while the
  # first still runs, and in separate containers the lock file cannot stop it (each sees its own PID 1).
  strategy:
    type: Recreate
    # Clears the live object's defaulted rollingUpdate block: without it `kubectl apply` fails validation
    # ("may not be specified when strategy type is 'Recreate'").
    rollingUpdate: null
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: root-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # Probes that survive a CPU storm on this node (24 Nov: 1 s exec probes timed out). Liveness is a TCP
        # connect made by the kubelet (no process spawned), and restarts postgres only after 2 minutes dead.
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
        # On SIGTERM postgres does a "smart" shutdown, which waits for every client to leave; the apps' pools
        # never do, so it would end in SIGKILL and crash recovery. A fast shutdown disconnects them,
        # checkpoints and exits cleanly.
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "su-exec postgres pg_ctl -D \"$PGDATA\" -m fast -w -t 50 stop"]
      terminationGracePeriodSeconds: 60
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
