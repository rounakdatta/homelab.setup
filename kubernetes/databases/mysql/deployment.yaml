---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: databases
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path  # K3s default storage class

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: databases
spec:
  # STOPPED (11 Nov 2026): the shared 10.5.2, a 2020 beta, replaced by MariaDB
  # 11.4 in ../mariadb, which serves every database here as copied and
  # verified table by table. Kept, with its untouched volume, as the rollback:
  # set this back to 1 and the Service selector below back to `app: mysql`.
  # Delete both, with the PVC, once the new server has proven itself.
  replicas: 0
  strategy:
    type: Recreate  # Important for databases to avoid concurrent access
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mariadb:10.5.2
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: root-password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: databases
spec:
  # The new 11.4 server (../mariadb). The apps keep this hostname,
  # mysql.databases.svc.cluster.local.
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP
