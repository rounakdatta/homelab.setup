# Values for the upstream blakeshome-charts/frigate chart (7.8.0).
# Chart docs: https://github.com/blakeblackshear/blakeshome-charts/tree/master/charts/frigate
#
# Chart appVersion lags Frigate itself; we override image.tag to a current
# Frigate release. Config-schema-wise, the keys used below (mqtt/detectors/
# record/snapshots/detect/cameras) are stable across 0.14 → 0.17, so the
# chart at 7.8.0 renders cleanly against 0.17.x.

image:
  repository: ghcr.io/blakeblackshear/frigate
  # Frigate 0.17.1 (released 2026-03-22). CPU-only AMD64 variant — for
  # accelerator builds switch to a -tensorrt / -rocm / -h8l suffix later.
  tag: "0.17.1"
  pullPolicy: IfNotPresent

# Schedule on the rishra worker (India), where the cameras live on the LAN.
# The label is applied by ansible/playbook.yml's worker post_task.
nodeSelector:
  homelab.setup/region: india
  homelab.setup/city: rishra

env:
  TZ: Asia/Kolkata

# Recreate is required: media PVC is RWO; a rolling update would deadlock on
# the PV mount during pod replacement.
strategyType: Recreate

# Frigate's decoder writes raw frames to /dev/shm (one decoded frame per
# camera). 1Gi covers a handful of cams at 1080p; bump if adding more.
shmSize: 1Gi

# /tmp gets snapshot/clip churn before files are moved to /media; tmpfs
# avoids SSD wear and keeps writes fast.
tmpfs:
  enabled: true
  sizeLimit: 1Gi

# No hardware acceleration on rishra today (CPU detector below). When a
# Coral USB stick or iGPU comes along, flip the matching block on and
# add the device mount + resource request.
coral:
  enabled: false
gpu:
  nvidia:
    enabled: false

persistence:
  config:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    # Keep the PVC across `helm uninstall` so config edits aren't lost on
    # chart-level churn. Velero still owns the durable backup.
    skipuninstall: true
    # Mount config.yml writable inside the pod so the in-app config editor
    # round-trips. Edits made in-app are blown away when the pod restarts
    # (which is what we want — this values.yaml is the source of truth).
    ephemeralWritableConfigYaml: true
  media:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    # Matches the previous motioneye media volume. local-path PVs are
    # node-pinned, so this 50Gi lives on the rishra worker.
    size: 50Gi
    skipuninstall: true

# We ship a standalone ingress.yaml (cert-manager + tinyauth middleware) to
# match the convention used by every other app in this repo.
ingress:
  enabled: false

service:
  type: ClusterIP
  port: 5000

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# When real cameras need authenticated RTSP, uncomment below and add the
# matching `frigate-rtsp-credentials` Secret to ansible/playbook.yml.
# The chart exposes each key in the Secret as an env var; reference them
# in cameras[].ffmpeg.inputs[].path as `{FRIGATE_RTSP_USERNAME}` etc.
# envFromSecrets:
#   - frigate-rtsp-credentials

# Frigate's runtime config. The chart wraps this in a ConfigMap and the
# init container copies it into the persistent config PVC at
# /config/config.yml (writable via ephemeralWritableConfigYaml above).
#
# NOTE: Frigate refuses to start without at least one camera defined.
# After the first deploy, fill in `cameras:` with real RTSP URLs and
# re-deploy — the pod will CrashLoopBackOff until then.
config: |
  mqtt:
    enabled: false

  detectors:
    cpu1:
      type: cpu
      num_threads: 3

  record:
    enabled: true
    retain:
      days: 3
      mode: motion
    alerts:
      retain:
        days: 14
    detections:
      retain:
        days: 7

  snapshots:
    enabled: true
    retain:
      default: 14

  detect:
    fps: 5
    width: 1280
    height: 720

  # cameras:
  #   front_door:
  #     ffmpeg:
  #       inputs:
  #         - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@192.168.1.100:554/stream
  #           roles:
  #             - detect
  #             - record
  #     detect:
  #       width: 1280
  #       height: 720
