# Values for the upstream nextcloud Helm chart 9.0.6 (appVersion 33.0.3).
# Chart docs: https://github.com/nextcloud/helm
#
# Migration notes:
# - The chart appVersion (33.0.3) is newer than what we run (33.0.1.2).
#   Image tag is pinned below to match the running version EXACTLY so
#   first-boot doesn't trigger `occ upgrade`. Bumps happen as a separate,
#   deliberate change with a fresh velero backup beforehand.
# - The chart's main PVC layout uses subPaths (config/, html/, root/, tmp/,
#   themes/, custom_apps/). We pre-populate config/config.php on a new 8Gi
#   nextcloud-main-pvc; the chart's image entrypoint populates html/ and the
#   other subdirs on first boot.
# - The data PVC (nextcloud-data-pvc) is reused as-is via existingClaim. The
#   chart's data volume mount has a baked-in `subPath: data`, but our PVC
#   has files at root — kustomization.yaml carries a JSON patch that strips
#   the subPath line so files mount at the volume root.

# 33.0.10 (from 33.0.1, 2026-11) for the security fixes since: an
# ImageMagick bug reachable through previews, two 2FA bypasses, and more.
# A patch release within 33: the image's entrypoint copies the new code in
# (never touching data/ or config/) and runs `occ upgrade` once, before
# Apache starts -- see startupProbe below.
#
# Pin to the exact image bits we run. Docker Hub
# version tags are 3-component (33.0.1-apache); the schema version
# 33.0.1.2 in our config.php is the in-container build number, not a
# Docker tag. Combining tag + digest gets us readability AND byte
# immutability — even if the maintainer rewrites 33.0.1-apache later,
# kubelet refuses to pull anything but this exact manifest.
# Empty tag would fall back to chart AppVersion (33.0.3) and trigger
# `occ upgrade` on first boot.
image:
  tag: "33.0.10-apache@sha256:81cb09055a20142521a267cea2bc27e6a81a065871c70850d209f08803567dbc"
  pullPolicy: IfNotPresent

# Service name = nextcloud (matches what our standalone ingress.yaml expects).
fullnameOverride: nextcloud

# Use our existing nextcloud-data-pvc (100Gi local-path, 25GB used).
persistence:
  enabled: true
  existingClaim: nextcloud-main-pvc
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data-pvc

# Disable bundled subcharts — we use our shared mysql in databases ns.
internalDatabase:
  enabled: false
mariadb:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false
nginx:
  enabled: false

externalDatabase:
  enabled: true
  type: mysql
  host: mysql.databases.svc.cluster.local
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    usernameKey: db-username
    passwordKey: db-password
    databaseKey: db-name

# OVERWRITEPROTOCOL=https — Traefik terminates TLS, the pod sees plaintext.
phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  host: nextcloud.taptappers.club
  trustedDomains:
    - nextcloud.taptappers.club

  # 0 = chart does NOT set NEXTCLOUD_UPDATE env var. With config.php already
  # present and image pinned, no occ upgrade triggers.
  update: 0

  # NEXTCLOUD_ADMIN_USER / NEXTCLOUD_ADMIN_PASSWORD are required env vars on
  # the chart's Deployment but are only consulted when the entrypoint sees
  # an empty config dir and decides to bootstrap a fresh install. Our
  # config.php is preserved on the new main PVC, so the bootstrap path
  # never runs. Letting the chart auto-create its own `nextcloud` Secret
  # from these literal values keeps Bitwarden out of the loop entirely
  # (existingSecret.enabled: false). The values are fixed strings rather
  # than random so the rendered Secret is stable across deploys.
  username: "not-used-existing-install"
  password: "not-used-existing-install"
  existingSecret:
    enabled: false

  # Don't auto-render any *.config.php into the config dir. Our existing
  # config.php fully controls behavior; chart-injected configs would be
  # mounted alongside and load via nextcloud's "load all config files in
  # /var/www/html/config" mechanism, which can quietly override settings
  # we want to keep authoritative.
  configs: {}
  defaultConfigs: {}

  # Skip the recursive fsGroup walk on the 25Gi data PVC. Files are already
  # owned by www-data (33:33) so the root-dir check passes immediately.
  podSecurityContext:
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch

  # Block the nextcloud container from starting until the migration Job
  # has dropped config.php into the new main PVC. This guards against the
  # race where (on local-path RWO co-mount) both pods schedule together
  # and the chart's entrypoint sees an empty config dir, deciding to
  # bootstrap a fresh install.
  extraInitContainers:
    - name: wait-for-config
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          i=0
          until [ -f /var/www/html/config/config.php ]; do
            i=$((i+1))
            if [ $i -gt 60 ]; then
              echo "config.php still missing after 2min, failing"
              exit 1
            fi
            echo "waiting for config.php to be migrated..."
            sleep 2
          done
          echo "config.php present, proceeding"
      volumeMounts:
        - name: nextcloud-main
          mountPath: /var/www/html/config
          subPath: config
    # The Obsidian volume holds three trees, owned by www-data so that
    # Nextcloud and Syncthing write the same files as the same user: vault/
    # (the notes), syncthing/ (its keys, config and index) and versions/ (the
    # old copies Syncthing keeps, out of Nextcloud's sight).
    - name: obsidian-dirs
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          mkdir -p /obsidian/vault /obsidian/syncthing /obsidian/versions
          chown 33:33 /obsidian/vault /obsidian/syncthing /obsidian/versions
      volumeMounts:
        - name: obsidian
          mountPath: /obsidian

  # The Obsidian vault. Syncthing keeps it in step with the Mac and the phone,
  # and Nextcloud shows it as /Obsidian (an External Storage mount, made by the
  # before-starting hook below), so an edit made in Nextcloud travels back the
  # same way. Syncthing is the only thing that syncs it: Nextcloud just reads
  # and writes the folder. Always on, so the Mac and the phone need never be
  # online at the same time.
  #
  # Syncthing runs as www-data (PUID/PGID 33), the user Nextcloud writes as,
  # and opens no port: it dials the Mac over the tailnet, and meets the phone
  # through Syncthing's relays. Its GUI and API listen on localhost only, so
  # it is configured with `kubectl exec ... -c syncthing -- syncthing cli`.
  # Its keys and config live on the volume, which Velero backs up nightly.
  extraSidecarContainers:
    - name: syncthing
      image: syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
      env:
        - name: PUID
          value: "33"
        - name: PGID
          value: "33"
        - name: STGUIADDRESS
          value: "127.0.0.1:8384"
        - name: STNODEFAULTFOLDER
          value: "1"
      volumeMounts:
        - name: obsidian
          mountPath: /var/syncthing/config
          subPath: syncthing
        - name: obsidian
          mountPath: /var/syncthing/Obsidian
          subPath: vault
        - name: obsidian
          mountPath: /var/syncthing/versions
          subPath: versions
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Reports to nightwatch whether this copy of the vault is in step with the Mac and
    # the phone (served at nextcloud-syncthing-status:8385; the script is inline so a
    # change to it rolls the pod, like the hook below). It
    # reads Syncthing's API on localhost with the key from Syncthing's own config, so
    # the key never leaves the pod, and it only ever reads. No probes on purpose: a
    # failing probe here would take the whole Nextcloud pod out of its Service.
    - name: syncthing-status
      image: python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
      command: ["python3", "-B", "-c"]
      args:
        - |
          """Tells nightwatch whether the Obsidian vault on this server is in step with the Mac and the phone.

          Runs beside Syncthing in the Nextcloud pod. It reads Syncthing's API on localhost with the key from
          Syncthing's own config, so the key never leaves the pod, and it never changes anything. GET / answers:

            in_step_at  the last time this copy and a peer (the Mac or the phone) were connected and fully in step.
                        Left out whenever something is wrong, which nightwatch reads as a failure (absent: fail).
            state       the folder's state: idle, scanning, syncing ...
            peers       for each peer: connected, last seen, in step
            problem     what is wrong, when something is

          It always answers 200 with that body, so the check's own words say what broke, not "HTTP 503".
          It looks every 30 seconds by itself, so even a short sync between two of nightwatch's visits counts,
          and it serves one request at a time with a short timeout, so nothing that connects can pile up threads.
          """
          import datetime as dt
          import http.server
          import json
          import os
          import re
          import threading
          import time
          import urllib.parse
          import urllib.request

          CONFIG = os.environ.get('ST_CONFIG', '/var/syncthing/config/config.xml')
          API = os.environ.get('ST_API', 'http://127.0.0.1:8384')
          FOLDER = os.environ.get('ST_FOLDER', '')  # empty: the only folder there is
          PORT = int(os.environ.get('PORT', '8385'))
          EVERY_S = 30

          lock = threading.Lock()
          in_step_at = None  # the last time this copy was fully in step with a connected peer
          latest = {'problem': 'starting'}


          def stamp(t):
              return t.astimezone(dt.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z') if t else None


          def parse(s):
              try:
                  t = dt.datetime.fromisoformat(str(s).replace('Z', '+00:00'))
              except ValueError:
                  return None
              return t if t.year > 2000 else None  # Syncthing says 1970 for "never"


          def api(path):
              with open(CONFIG, encoding='utf-8') as f:
                  key = re.search(r'<apikey>([^<]+)</apikey>', f.read()).group(1)
              req = urllib.request.Request(API + path, headers={'X-API-Key': key})
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)


          def summary():
              global in_step_at
              cfg = api('/rest/config')
              me = api('/rest/system/status')['myID']
              folders = cfg.get('folders') or []
              folder = next((f for f in folders if f['id'] == FOLDER), None) if FOLDER else (folders[0] if len(folders) == 1 else None)
              if folder is None:
                  return {'problem': 'the vault folder is not set up'}
              if folder.get('paused'):
                  return {'problem': 'the vault folder is paused'}
              fid = urllib.parse.quote(folder['id'])
              status = api(f'/rest/db/status?folder={fid}')
              errors = api(f'/rest/folder/errors?folder={fid}').get('errors') or []
              conns = api('/rest/system/connections').get('connections') or {}
              seen = api('/rest/stats/device')
              names = {d['deviceID']: d.get('name') or d['deviceID'][:7] for d in cfg.get('devices') or []}
              here_done = status.get('needTotalItems', 1) == 0
              peers, in_step_now = {}, False
              for d in folder.get('devices') or []:
                  dev = d['deviceID']
                  if dev == me:
                      continue
                  c = conns.get(dev) or {}
                  connected = bool(c.get('connected')) and not c.get('paused')
                  done = False
                  if connected:
                      comp = api(f'/rest/db/completion?folder={fid}&device={urllib.parse.quote(dev)}')
                      # a peer that paused or stopped sharing the folder keeps its last index at 100%: not in step
                      done = comp.get('remoteState') == 'valid' and comp.get('completion') == 100 and comp.get('needItems', 1) == 0
                  in_step = connected and done and here_done
                  in_step_now = in_step_now or in_step
                  last = parse((seen.get(dev) or {}).get('lastSeen'))
                  peers[names.get(dev, dev[:7])] = {'connected': connected, 'last_seen': stamp(last), 'in_step': in_step}
              if in_step_now:
                  in_step_at = dt.datetime.now(dt.timezone.utc)
              elif in_step_at is None:  # just started, no peer in step yet: when an offline peer was last seen is the best guess
                  last = [parse(p['last_seen']) for p in peers.values() if p['last_seen'] and not p['connected']]
                  in_step_at = max(last) if last else None
              body = {'state': status.get('state'), 'need_items': status.get('needTotalItems'), 'peers': peers}
              if status.get('state') in ('error', 'stopped', 'unknown') or status.get('error'):
                  body['problem'] = 'the vault folder is in error: ' + str(status.get('error') or status.get('state'))
              elif errors or status.get('pullErrors'):
                  body['problem'] = f'{len(errors) or status.get("pullErrors")} files cannot sync'
              elif in_step_at:
                  body['in_step_at'] = stamp(in_step_at)
              return body


          def watch():
              global latest
              while True:
                  try:
                      body = summary()
                  except Exception as e:  # Syncthing down, its config unreadable ...: say so, never stop
                      body = {'problem': f'cannot read Syncthing: {type(e).__name__}'}
                  with lock:
                      latest = body
                  time.sleep(EVERY_S)


          class Handler(http.server.BaseHTTPRequestHandler):
              timeout = 5  # a client that sends nothing is dropped

              def do_GET(self):
                  if self.path.split('?')[0] != '/':
                      self.send_error(404)
                      return
                  with lock:
                      data = json.dumps(latest).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Cache-Control', 'no-store')
                  self.send_header('Content-Length', str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def log_message(self, *args):
                  pass


          if __name__ == '__main__':
              threading.Thread(target=watch, daemon=True).start()
              http.server.HTTPServer(('', PORT), Handler).serve_forever()
      env:
        - name: ST_CONFIG
          value: /var/syncthing/config/config.xml
        - name: PORT
          value: "8385"
      ports:
        - name: st-status
          containerPort: 8385
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: obsidian
          mountPath: /var/syncthing/config
          subPath: syncthing
          readOnly: true
      resources:
        requests:
          cpu: 5m
          memory: 24Mi
        limits:
          cpu: 100m
          memory: 64Mi

  extraVolumes:
    - name: obsidian
      persistentVolumeClaim:
        claimName: nextcloud-obsidian-pvc

  # The chart appends these to the web and the cron container alike.
  extraVolumeMounts:
    - name: obsidian
      mountPath: /srv/obsidian
      subPath: vault

  # Runs as www-data before Apache on every start, so the mount comes back by
  # itself after a rebuild. Idempotent.
  hooks:
    before-starting: |
      #!/bin/sh
      set -eu
      occ() { php /var/www/html/occ "$@"; }

      occ app:enable files_external >/dev/null
      # Local storage is off by default; this one mount is what it is for.
      occ config:system:set files_external_allow_create_new_local --value=true --type=boolean >/dev/null

      id=$(occ files_external:list --output=json | php -r '
        foreach (json_decode(stream_get_contents(STDIN), true) ?: [] as $m)
          if ($m["mount_point"] === "/Obsidian") { echo $m["mount_id"]; break; }')
      if [ -z "$id" ]; then
        id=$(occ files_external:create /Obsidian local null::null -c datadir=/srv/obsidian | grep -o '[0-9]*$')
        occ files_external:applicable --add-user=admin "$id" >/dev/null
        echo "obsidian: External Storage mount $id created"
      fi
      # Syncthing writes behind Nextcloud's back: look for changes on every access.
      occ files_external:option "$id" filesystem_check_changes 1 >/dev/null

# Chart's default 10s initialDelaySeconds is too short for nextcloud's
# first-boot entrypoint (it rsyncs the install from /usr/src/nextcloud
# into the new main PVC's html/ subPath, which can take 30–60s on first
# boot). Match what the prior hand-rolled Deployment used (60/30) so the
# probes don't kill the pod before Apache finishes starting.
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

# An image upgrade runs entirely BEFORE Apache starts (code copy, then
# `occ upgrade`'s database migrations), so liveness would kill the container
# ~2.5 min in -- mid-migration, if the node is slow. The startup probe holds
# liveness and readiness off for up to 30 minutes until /status.php answers;
# a container that fails outright still restarts at once.
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 180

# We keep our standalone ingress.yaml + middleware.yaml — chart ingress off.
ingress:
  enabled: false

# ClusterIP on port 80 to match what the existing ingress points to.
service:
  type: ClusterIP
  port: 80

# Match the resources from the prior hand-rolled Deployment.
resources:
  requests:
    memory: "1Gi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# Background jobs: the chart's crond sidecar runs cron.php every 5 minutes.
# Without it Nextcloud sat in "ajax" mode (jobs ran only on web page loads), so
# expired transactional file locks were never cleaned: older files refused every
# write with 423 "is locked" for all clients. Old versions and trash never expired
# either. The sidecar shares the web container's image, env and volumes (see the
# data-mount patch in kustomization.yaml). crond runs as root and drops cron.php
# to www-data. The first runs work through a backlog, so CPU and memory are capped.
cronjob:
  enabled: true
  type: sidecar
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        # Up to three cron.php can overlap (each runs up to 14 min) at PHP's 512M cap. An
        # OOM here would restart the container and briefly mark the whole pod unready.
        memory: 2Gi

# No metrics exporter — we don't currently run one.
metrics:
  enabled: false
