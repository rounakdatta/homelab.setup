image:
  repository: ghcr.io/rounakdatta/itineris
  # Empty means "use Chart.appVersion", so a release tag that sets
  # --app-version moves the image with it and the two cannot drift. Set it
  # explicitly to roll the image forward without bumping the chart.
  tag: ""
  pullPolicy: IfNotPresent

# The public site is stateless -- the image IS the shell. Scaling is safe;
# one nginx serving a few megabytes of static files is plenty.
replicaCount: 1

service:
  type: ClusterIP
  port: 80

# nginx-unprivileged listens here; anything below 1024 would need a capability
# the container drops.
containerPort: 8080

# Unlike a workload that boots for minutes, a static site is either serving or
# it isn't, so probes are cheap and honest here.
probes:
  enabled: true
  path: /healthz

# The journal itself: data/moments.json, data/tracks.json, media/ (public
# derivatives) and originals/ (never served). nginx mounts data/ and media/
# read-only; the admin writes everything. ReadWriteOnce is node-scoped, so two
# pods on the same node can share it -- fine on a single-node cluster, and the
# reason this pins both pods to one node on a multi-node one.
#
# Without persistence the site serves the seed baked into the image and the
# admin has nowhere to write, so admin.enabled requires this.
persistence:
  enabled: true
  # local-path is the homelab's only storage class, and it is node-local.
  storageClass: ""
  size: 20Gi
  accessMode: ReadWriteOnce
  # Reuse a pre-existing PVC instead of letting the chart create one.
  existingClaim: ""

# Google Maps as the map. Empty apiKey: the viewer draws MapLibre + Carto,
# which "Save for offline" can keep. With a key -- a Maps JavaScript API key
# restricted to this site's hostname; Google gives 10,000 free map loads a
# month -- the viewer draws Google's map with the photos as pins and falls back
# to MapLibre when offline. The key ships to browsers in /config.json (public
# by nature, hence the referrer restriction; it is not a secret).
googleMaps:
  # Either put the key here (fine for a private values file) ...
  apiKey: ""
  # ... or, better for a public deployment repo, name a Secret in the release's
  # namespace whose key `apiKey` holds it (the homelab's Bitwarden sync makes
  # one). The Secret is optional at pod start: absent = MapLibre until it lands
  # and the pod restarts (every deploy restarts it).
  existingSecret: ""
  # Optional Map ID (Cloud-based map styling). Google's demo id is used when empty.
  mapId: ""
  # The admin also uses the key server-side for Places API (New) lookups --
  # rating, review count, kind of place -- once per place, refreshed monthly
  # (1,000 free a month). If the browser key is referrer-restricted, add a
  # second, server-only key as `placesApiKey` in the same Secret.

# Upload + tagging UI and API, served under /admin on the same host. The chart
# ships no Ingress: the deployment repo puts THIS service behind tinyauth and
# leaves the public service open.
admin:
  enabled: true
  image:
    repository: ghcr.io/rounakdatta/itineris-admin
    # Same rule as image.tag: empty = Chart.appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  # Comma-separated e-mail allowlist checked AFTER tinyauth. Empty trusts
  # tinyauth's own whitelist entirely, which is the usual choice.
  allowedEmails: ""
  # Uploads are decoded in memory and re-encoded by sharp. A 48 MP photo is
  # ~200 MB decoded, and two uploads can be in flight at once, so the limit
  # sits far above the request; sharp runs single-threaded with no cache to
  # keep the peak bounded.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi

# Pod-level. nginx-unprivileged runs as 101:101, and the admin image deliberately
# uses the same uid so both own what the other writes on the shared volume.
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext, applied per-container in both Deployments.
# Distinct from the pod securityContext above: capabilities and privilege
# escalation are container properties, not pod ones.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Holds because nginx-unprivileged keeps its pid file and temp paths under
  # /tmp (mounted as an emptyDir), and the admin writes only to the volume.
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

nodeSelector: {}
tolerations: []
