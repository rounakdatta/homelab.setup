apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "itineris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The default RollingUpdate is correct here: the volume is mounted read-only,
  # so two pods overlapping during a rollout is harmless.
  selector:
    matchLabels:
      {{- include "itineris.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itineris.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if or .Values.persistence.enabled .Values.googleMaps.existingSecret }}
      initContainers:
        {{- if .Values.googleMaps.existingSecret }}
        # Render /config.json from the Secret so the browser key never has to
        # live in a values file. Optional: no Secret yet means an empty key,
        # which the viewer treats as "draw MapLibre".
        - name: config
          image: {{ include "itineris.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.googleMaps.existingSecret | quote }}
                  key: apiKey
                  optional: true
            - name: GOOGLE_MAPS_MAP_ID
              value: {{ .Values.googleMaps.mapId | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf '{"googleMapsApiKey":"%s","googleMapsMapId":"%s"}' "$GOOGLE_MAPS_API_KEY" "$GOOGLE_MAPS_MAP_ID" > /config/config.json
              [ -n "$GOOGLE_MAPS_API_KEY" ] && echo "config.json rendered with a Google Maps key" || echo "no Google Maps key in the Secret yet; the viewer will draw MapLibre"
          volumeMounts:
            - name: config
              mountPath: /config
        {{- end }}
        {{- if .Values.persistence.enabled }}
        # First run on an empty volume: copy the demo trip baked into this
        # image so the site is never blank -- the private library from
        # /seed/library and the public gallery + media from the served root.
        # The check is a sentinel file, NOT cp -u/-n (busybox cp lacks -n, and
        # -u would overwrite older user data with newer seed files on the next
        # image bump). Either layout counts as "has data": the 0.3 library, or
        # the 0.2 public moments.json that the admin migrates on its own boot.
        - name: seed
          image: {{ include "itineris.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /pvc/library/moments.json ] || [ -f /pvc/data/moments.json ]; then
                echo "volume already has data; leaving it alone"
              else
                mkdir -p /pvc/library /pvc/data /pvc/media /pvc/originals \
                && cp -r /seed/library/. /pvc/library/ \
                && cp -r /usr/share/nginx/html/data/. /pvc/data/ \
                && cp -r /usr/share/nginx/html/media/. /pvc/media/ \
                && echo "seeded volume from image"
              fi
          volumeMounts:
            - name: data
              mountPath: /pvc
        {{- end }}
      {{- end }}
      containers:
        - name: itineris
          image: {{ include "itineris.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            # Shadow the image's seed copies with the live volume. Read-only:
            # nginx must never be able to write what the admin owns.
            - name: data
              mountPath: /usr/share/nginx/html/data
              subPath: data
              readOnly: true
            - name: data
              mountPath: /usr/share/nginx/html/media
              subPath: media
              readOnly: true
            {{- end }}
            {{- if or .Values.googleMaps.existingSecret .Values.googleMaps.apiKey }}
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            {{- end }}
      volumes:
        # The one writable path a read-only rootfs needs: nginx-unprivileged
        # puts its pid file and every *_temp_path here.
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "itineris.claimName" . }}
        {{- end }}
        {{- if .Values.googleMaps.existingSecret }}
        - name: config
          emptyDir: {}
        {{- else if .Values.googleMaps.apiKey }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
