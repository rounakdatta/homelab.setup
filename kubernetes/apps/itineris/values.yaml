# Values for the rounakdatta/itineris chart.
# Chart source: oci://ghcr.io/rounakdatta/charts/itineris
#
# itineris is a static travel journal -- map, timeline, photo wall and
# Instagram-style stories -- served by nginx from an image that IS the site.
# No database, no secrets. State is one PVC -- originals, derivatives and the
# journal -- which Velero backs up nightly like every other PVC.

image:
  repository: ghcr.io/rounakdatta/itineris
  # The chart already defaults this to its appVersion, so the pin is redundant
  # on purpose: it puts the deployed image next to the chart version in
  # kustomization.yaml, so a bump PR touches both lines together -- the same
  # convention agentfest follows.
  tag: "0.22.0"

# Photos, derivatives and the journal. local-path is advisory only (no quota
# enforcement): the real limit is the node's free disk, so treat the size as
# documentation of intent. Node-local, so this pins both itineris pods to
# whichever node first schedules them.
persistence:
  enabled: true
  # Declared in pvc.yaml (see the story there); the chart's own claim,
  # itineris-data, is stranded on the rishra worker and kept for recovery.
  existingClaim: itineris-data-cp

# Uploads + tagging at /admin, behind tinyauth via ingress-admin.yaml. The
# empty allowlist means tinyauth's whitelist is the gate, same as every other
# app in this cluster.
admin:
  enabled: true
  image:
    tag: "0.22.0"
  # EMPTY MEANS ANYONE, deliberately: every gallery carries a "Make my own"
  # button and strangers are meant to sign in and get their own journal.
  allowedEmails: ""
  # Google sign-in. With this set the service runs the authorization-code flow
  # itself and STOPS trusting the forward-auth header -- which is why
  # ingress-admin.yaml drops the tinyauth middleware in the same change. The
  # two must never be separated: no Google client + no tinyauth would mean the
  # header is believed and anyone can set it.
  #
  # The Secret comes from Bitwarden via ansible/playbook.yml, from the SAME
  # Google client tinyauth signs people in with -- one OAuth client may carry
  # several authorised redirect URIs, so itineris only needed its own adding.
  # Reusing the client does NOT reuse tinyauth's whitelist: who may sign in
  # here is `allowedEmails` above, empty on purpose.
  #
  # Without the Secret the admin pod will not start, which is the failure mode
  # we want -- /creator goes 503 rather than wide open, and the public viewer
  # is untouched.
  auth:
    existingSecret: itineris-google-oauth
    # EMPTY ON PURPOSE, and this is what makes extra domains free.
    #
    # The server builds its OAuth redirect_uri from this value when it is set,
    # unconditionally, ignoring the request. Pinned to one host, a visitor who
    # signs in at any OTHER name is sent to Google with the pinned host's
    # redirect_uri and lands back there -- signed in on the wrong origin, still
    # logged out on the one they came from.
    #
    # Empty, the server derives it per request from X-Forwarded-Host, which
    # Traefik sets. Every host in ingress.yaml then signs in against itself,
    # with no per-domain config here and nothing to update when another is
    # added. Session cookies are host-only (no Domain attribute), so the two
    # sites keep genuinely separate sessions.
    #
    # The gate is then Google's authorised-redirect-URI allowlist, which is
    # where it belongs: a spoofed Host can only produce a redirect_uri that
    # Google rejects. EVERY domain needs its own
    # https://<domain>/creator/auth/callback added to the OAuth client, or
    # sign-in on that domain fails at Google with redirect_uri_mismatch.
    publicUrl: ""

# Pinned to the control-plane node, unlike most apps here. Unpinned, the
# scheduler put itineris on the rishra worker `jomjom` at its very first deploy,
# the local-path volume then bound there, and every rollout was forced back to
# a node that is unreachable whenever that house's link is -- which is how the
# public site went 503 on 2026-09-05. A site meant to be shared belongs on the
# node that is always there. (frigate/ntfy/home-assistant carry city=rishra on
# purpose; that is the other side of the same coin.)
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"

# Google Maps as the map. The browser key comes from the Secret the Bitwarden
# sync creates (see ansible/playbook.yml, item itineris/google_maps_api_key),
# never from this file: this repo is public. Until the Secret exists the site
# draws MapLibre; the next deploy after it lands switches to Google Maps.
googleMaps:
  existingSecret: itineris-google-maps
