# Values for the rounakdatta/itineris chart.
# Chart source: oci://ghcr.io/rounakdatta/charts/itineris
#
# itineris is a static travel journal -- map, timeline, photo wall and
# Instagram-style stories -- served by nginx from an image that IS the site.
# No database, no secrets. State is one PVC -- originals, derivatives and the
# journal -- which Velero backs up nightly like every other PVC.

image:
  repository: ghcr.io/rounakdatta/itineris
  # The chart already defaults this to its appVersion, so the pin is redundant
  # on purpose: it puts the deployed image next to the chart version in
  # kustomization.yaml, so a bump PR touches both lines together -- the same
  # convention agentfest follows.
  tag: "0.4.2"

# Photos, derivatives and the journal. local-path is advisory only (no quota
# enforcement): the real limit is the node's free disk, so treat the size as
# documentation of intent. Node-local, so this pins both itineris pods to
# whichever node first schedules them.
persistence:
  enabled: true
  # Declared in pvc.yaml (see the story there); the chart's own claim,
  # itineris-data, is stranded on the rishra worker and kept for recovery.
  existingClaim: itineris-data-cp

# Uploads + tagging at /admin, behind tinyauth via ingress-admin.yaml. The
# empty allowlist means tinyauth's whitelist is the gate, same as every other
# app in this cluster.
admin:
  enabled: true
  image:
    tag: "0.4.2"
  allowedEmails: ""

# Pinned to the control-plane node, unlike most apps here. Unpinned, the
# scheduler put itineris on the rishra worker `jomjom` at its very first deploy,
# the local-path volume then bound there, and every rollout was forced back to
# a node that is unreachable whenever that house's link is -- which is how the
# public site went 503 on 2026-09-05. A site meant to be shared belongs on the
# node that is always there. (frigate/ntfy/home-assistant carry city=rishra on
# purpose; that is the other side of the same coin.)
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
