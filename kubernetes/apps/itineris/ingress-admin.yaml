---
# The creator app -- sign in, upload, curate -- on the SAME host as the public
# viewer. Was /admin behind tinyauth until 0.21.0.
#
# NO tinyauth middleware any more, on purpose. itineris runs Google's
# authorization-code flow itself now, and every gallery carries a "Make my own"
# button that sends strangers here; a forward-auth login in front would block
# exactly the people the button is for.
#
# THIS CHANGE AND values.yaml's admin.auth MUST SHIP TOGETHER. The server falls
# back to trusting a `Remote-Email` header when no Google client is configured,
# so dropping tinyauth on its own would mean anyone who sets that header is
# anyone they like. With the Secret present the header is ignored outright; if
# the Secret is missing the pod refuses to start, which is the safe direction.
#
# /admin stays routed here so old bookmarks and the installed PWA still work:
# the app answers them with a 301 to the matching /creator path. It no longer
# needs the middleware either, since everything behind it checks the session.
#
# Traefik attaches middlewares per router, and each Ingress object is its own
# router. This object's path rules are longer than ingress.yaml's "/", so they
# win priority and never reach nginx, while "/" stays open to visitors.
# The object keeps its old NAME deliberately: `kubectl apply` does not prune,
# so a renamed Ingress would leave the tinyauth-gated one behind still
# claiming /admin.
#
# No cert-manager annotation on purpose: ingress.yaml owns the certificate for
# this host; this object only reuses its secret so the router is TLS. Two
# issuers for one secret would fight.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itineris-admin
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  # EVERY host in ingress.yaml must also appear here. The public viewer's rule
  # is a bare "/" prefix, so a host routed there but not here would serve the
  # VIEWER at /creator via the SPA fallback rather than the creator app -- and
  # every gallery carries a "Make my own" button linking to a root-relative
  # /creator/, so that button would quietly break on the missing domain instead
  # of 404ing.
  rules:
  - host: itineris.world
    http:
      paths:
      - path: /creator
        pathType: Prefix
        backend:
          service:
            name: itineris-admin
            port:
              number: 80
      # Old bookmarks and the installed PWA; the app 301s these to /creator.
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: itineris-admin
            port:
              number: 80
  - host: itineris.taptappers.club
    http:
      paths:
      - path: /creator
        pathType: Prefix
        backend:
          service:
            name: itineris-admin
            port:
              number: 80
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: itineris-admin
            port:
              number: 80
  tls:
  - hosts:
    - itineris.world
    - itineris.taptappers.club
    secretName: itineris-tls-secret
