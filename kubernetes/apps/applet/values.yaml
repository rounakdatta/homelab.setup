---
image:
  repository: ghcr.io/rounakdatta/applet
  tag: "0.2.2"

# The image is private (github.com/rounakdatta/applet). deploy-stuff.yml builds
# this ghcr-pull Secret from the GHCR_READ_TOKEN repository secret (interim,
# like itineris-google-maps).
imagePullSecrets:
  - name: ghcr-pull

controller:
  # No CPU request: idle between calls, so it yields under contention rather
  # than reserving a core.
  resources:
    requests:
      cpu: null
      memory: 128Mi
    # F-Droid's index is ~75 MB and applet reads it whole and parses it in memory,
    # alongside curl and apkeep: at 192Mi the index fetch died with no error.
    limits:
      memory: 512Mi
  # Everything lives on the Paris worker. local-path binds a volume to the node
  # that first mounts it, so the controller's state must sit beside the phone,
  # and the RAM-tight control plane stays out of it entirely. The chart's
  # default selector (control-plane: "true") must be nulled: Helm merges maps,
  # so adding a key alone kept both, which no node matched.
  nodeSelector:
    homelab.setup/city: paris
    node-role.kubernetes.io/control-plane: null
  storage:
    size: 5Gi
    storageClass: local-path

# No ingress: private apps are going tailnet-only (homelab.setup#292), so the
# console and /mcp are reached in-cluster, at applet.apps.svc.cluster.local:8080.
# The console's own cookie login (admin-key) is its guard; /mcp has its bearer.
auth:
  cookieAuth: true

secret:
  create: false
  existingSecret: applet

# F-Droid first (hash-verified against its signed index), then APKPure for the
# Play-only apps. APKPure is acknowledged deliberately; Android itself refuses
# any later update signed by a different key.
sources: "fdroid,apkpure"
apkpureAck: true

phoneDefaults:
  # redroid 11 + OpenGApps pico + libndk (applet's phone-image workflow): Rapido
  # and most Indian apps need Google Play services and ship only ARM code. No
  # Google sign-in. Private; pulled with the same ghcr-pull Secret as the
  # controller.
  image:
    repository: ghcr.io/rounakdatta/applet-phone
    tag: "11.0.0-gapps-ndk"
  storage:
    size: 8Gi
    storageClass: local-path
  resources:
    requests:
      cpu: null
      memory: 512Mi
    limits:
      memory: 3Gi
  # The Paris worker has the binder module (binder=true in deploy-infra's
  # inventory runs the `binder` role there). Same nulled default as above.
  nodeSelector:
    homelab.setup/city: paris
    node-role.kubernetes.io/control-plane: null

phones:
  - name: rounak
    arch: amd64
    # The image translates ARM code (libndk), and many apps ship ARM builds only
    # (Rapido: armeabi-v7a), so applet fetches for each of these, in order.
    abis: [x86_64, x86, arm64-v8a, armeabi-v7a]

ingress:
  enabled: false
