{{- if .Values.secret.create }}
# Only rendered when secret.create is true. The homelab default is a
# Bitwarden-synced Secret named `applet` with keys admin-key and mcp-bearer.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "applet.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-key: {{ required "secret.adminKey is required when secret.create is true" .Values.secret.adminKey | quote }}
  mcp-bearer: {{ .Values.secret.mcpBearer | quote }}
{{- end }}
