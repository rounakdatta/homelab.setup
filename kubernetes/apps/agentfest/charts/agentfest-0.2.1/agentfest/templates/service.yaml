{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "agentfest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: paseo
      port: {{ .Values.service.port }}
      targetPort: paseo
      protocol: TCP
  selector:
    {{- include "agentfest.selectorLabels" . | nindent 4 }}
{{- end }}
