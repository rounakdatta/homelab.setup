{{- if and .Values.auth.enabled .Values.auth.create (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    {{- include "agentfest.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.codemanPassword }}
  codeman-password: {{ .Values.auth.codemanPassword | quote }}
  {{- else }}
  {{- /*
    Generated once and then preserved across upgrades by looking up the live
    Secret — otherwise every `helm upgrade` would silently rotate the password
    and lock out every device that had logged in.
  */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-auth" .Release.Name) }}
  {{- if $existing }}
  codeman-password: {{ index $existing.data "codeman-password" | b64dec | quote }}
  {{- else }}
  codeman-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
{{- end }}
