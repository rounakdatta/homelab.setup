---
# Inbound to the Paseo computer: nothing. There is no ingress and no Service,
# and the daemon listens on loopback only (values.yaml, paseo.listenHost):
# phones and laptops come in through Paseo's relay, which the daemon dials out
# to. festie's pod was the one exception, until festie was retired.
#
# Egress stays at the default (allow-all): the relay, npm, GitHub and the
# model APIs are all outbound.
#
# NOTE: k3s must be running its NetworkPolicy controller (the default; disabled
# only with --disable-network-policy). A policy with no enforcer has no effect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentfest-netpol
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentfest
      app.kubernetes.io/instance: agentfest
  policyTypes:
    - Ingress
  ingress: []
