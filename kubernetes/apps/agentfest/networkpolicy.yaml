---
# Inbound to the Paseo computer: festie's pod on the daemon port, and nothing
# else. There is no ingress: phones and laptops come in through Paseo's relay,
# which the daemon dials out to, so no inbound rule is needed for them at all.
#
# The festie rule is transitional (see values.yaml, paseo.listenHost). When
# festie goes, delete it and leave `ingress: []`, which denies everything.
#
# Egress stays at the default (allow-all): the relay, npm, GitHub and the
# model APIs are all outbound.
#
# NOTE: k3s must be running its NetworkPolicy controller (the default; disabled
# only with --disable-network-policy). A policy with no enforcer has no effect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentfest-netpol
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentfest
      app.kubernetes.io/instance: agentfest
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentfest
              app.kubernetes.io/instance: festie
      ports:
        - protocol: TCP
          port: 6767
