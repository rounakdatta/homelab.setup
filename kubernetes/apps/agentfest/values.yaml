image:
  repository: ghcr.io/rounakdatta/agentfest
  tag: "0.1.31"

# Codeman rejects unknown Host headers before any handler runs — it is a
# DNS-rebinding guard. Tailscale's .ts.net is allowed out of the box; this
# Traefik hostname is not, and every request returns `403 host not allowed`
# until it is listed here.
# Pin the self-updating components to exact versions rather than tracking
# "latest", so upgrades are deliberate and reproducible. Bump after reviewing
# the release notes, then restart the pod.
claudeCode:
  version: "2.1.233"

codeman:
  version: "1.24.7"
  allowedHosts: "festie.taptappers.club"

persistence:
  enabled: true
  # Advisory only: local-path does not enforce quotas, it just provisions a
  # directory on the node. The real limit is the node's free disk, so treat
  # this as documentation of intent and adjust it to whatever is actually
  # spare. It is also node-local — this PVC pins the pod to whichever node
  # first schedules it, permanently.
  size: 100Gi

# Codeman's own Basic auth is OFF here, so tinyauth (Google OAuth + the email
# whitelist) is the only thing between the internet and a shell on this box.
# That is a deliberate reduction, not an oversight — the chart's values.yaml
# carries the full reasoning. The short version: Codeman only implements HTTP
# Basic, and its hardcoded brute-force limiter is hostile behind an ingress,
# because it builds Fastify without trustProxy so every device shares one bucket
# of ten failures. The 429 it returns carries no WWW-Authenticate header, so the
# browser stops offering the password dialog and the correct password can no
# longer be presented at all.
#
# Worth re-reading before the next hostname change: festie.taptappers.club
# resolves to a PUBLIC IP (cert-manager's HTTP-01 solver needs port 80
# reachable), so "it's on the tailnet" is not a layer here.
#
# existingSecret is left pointing at festie-auth on purpose. The secret still
# syncs from Bitwarden and is simply unused, which makes flipping this back a
# one-line change rather than a secrets round-trip.
auth:
  enabled: false
  create: false
  existingSecret: festie-auth

# Not optional in practice: dotfiles' claude-skills module clones agent-smith
# during home-manager activation, and that clone is not fault tolerant. The
# entrypoint copies this key into ~/.ssh (it cannot be mounted there directly —
# ~/.ssh must stay writable for home-manager's ssh config and known_hosts).
ssh:
  enabled: true
  existingSecret: festie-secrets

# Sized for real work — compiles, container builds, language servers. The
# memory limit is deliberately far above the request: an agent left running
# overnight should be able to burst without being OOM-killed mid-task.
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    memory: 24Gi

# Deliberately unpinned, matching every app except frigate/ntfy: those two
# carry homelab.setup/city=rishra because they belong to that physical
# location. This is general compute and belongs on the main node.
nodeSelector: {}
