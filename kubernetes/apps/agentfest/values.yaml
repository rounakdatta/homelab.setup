image:
  repository: ghcr.io/rounakdatta/agentfest
  tag: "0.2.0"

# Pin the self-updating components to exact versions rather than tracking
# "latest", so upgrades are deliberate and reproducible. Bump after reviewing
# the release notes, then restart the pod. Both pins are compared with what is
# actually installed on the volume, so a drifted install is put back.
#
# 2.1.280 is the floor for Opus 5.5.
claudeCode:
  version: "2.1.285"

paseo:
  version: "0.10.2"

  # The pod network, not just loopback, for one reason: festie. While festie
  # still runs, its sessions (and the Claude in them) reach this daemon over
  # the cluster network to print the pairing link and to check a deploy — the
  # NetworkPolicy next door admits festie's pod and nothing else, and the
  # password is required on that path as on every other. Back to "127.0.0.1",
  # with the Service off, when festie goes.
  listenHost: "0.0.0.0"

  relay:
    enabled: true

  # Synced from Bitwarden `agentfest/paseo_password` by the secrets play. The
  # same value goes into the Paseo app when pairing.
  password:
    existingSecret: agentfest-auth

  # The names festie connects by. Paseo's DNS-rebinding guard answers only to
  # localhost and IP literals otherwise.
  hostnames:
    - agentfest
    - agentfest.apps
    - agentfest.apps.svc
    - agentfest.apps.svc.cluster.local

service:
  enabled: true

persistence:
  enabled: true
  # Advisory only: local-path does not enforce quotas. It is also node-local,
  # which is why nodeSelector below has to be right from the first deploy —
  # the claim binds wherever the pod first lands, permanently.
  size: 100Gi

# The same machine identity as festie: the deploy key and the GPG key that
# dotfiles reads during activation.
ssh:
  enabled: true
  existingSecret: festie-secrets

# Sized to share the 16 GB node with festie while both exist. With the rest of
# the node at 3.5–5.5 GiB and festie capped at 10Gi, a cap here beyond ~6Gi
# would only let the two together push the node into swap. Move festie's
# budget over when it goes (10Gi, the same as festie's cap).
#
# The CPU request fits: the node's requests sat at 3805m of 6000m on 29 Sep.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 6Gi

# Same reasons as festie (see ../festie/kustomization.yaml): dshm cannot
# outlive the pod, and home is regenerable state whose durable parts live
# elsewhere, so neither belongs in the nightly backup. ndots:1 because every
# external lookup otherwise walks five search domains first.
podAnnotations:
  backup.velero.io/backup-volumes-excludes: "dshm,home"

dnsConfig:
  options:
    - name: ndots
      value: "1"

# Pinned to the control plane from the very first deploy. nodeSelector {} does
# NOT mean "the main node": the scheduler once put itineris on the Rishra
# worker, its local-path claim bound there, and the site went down with that
# node.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
