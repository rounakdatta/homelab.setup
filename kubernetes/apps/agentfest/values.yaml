image:
  repository: ghcr.io/rounakdatta/agentfest
  tag: "0.2.4"

# Pin the self-updating components to exact versions rather than tracking
# "latest", so upgrades are deliberate and reproducible. Bump after reviewing
# the release notes, then restart the pod. Both pins are compared with what is
# actually installed on the volume, so a drifted install is put back.
#
# 2.1.280 is the floor for Opus 5.5.
claudeCode:
  version: "2.1.285"

paseo:
  version: "0.10.2"

  # Loopback only. Phones and laptops come in through Paseo's relay, which
  # the daemon dials out to, so nothing in the cluster connects to it (festie
  # did, until it was retired on 5 Oct 2026).
  listenHost: "127.0.0.1"

  relay:
    enabled: true

  # The mode new Claude agents start in, in every client. Bypass for the
  # reason festie's Codeman ran it (dotfiles hosts/festie, claudePermissionMode):
  # this machine exists for work that finishes while nobody is watching, and a
  # prompt waiting for an answer is the one failure that costs the whole
  # session. The rest of "Opus 5.5 at max, bypass" — model, thinking level,
  # the profile, the projects — is declared in dotfiles (configs/paseo).
  claudeDefaultMode: bypassPermissions

  # Synced from Bitwarden `agentfest/paseo_password` by the secrets play. The
  # same value goes into the Paseo app when pairing.
  password:
    existingSecret: agentfest-auth

  # Dictation and voice mode, on: Rounak asked for them (30 Sep). Local
  # models, so no audio leaves the machine; the first boot fetches ~800 MB
  # into ~/.paseo on the volume, once.
  voice:
    enabled: true

# No Service: nothing in the cluster connects to the daemon.
service:
  enabled: false

persistence:
  enabled: true
  # Advisory only: local-path does not enforce quotas. It is also node-local,
  # which is why nodeSelector below has to be right from the first deploy —
  # the claim binds wherever the pod first lands, permanently.
  size: 100Gi

# The machine identity festie had, still under festie's name: the deploy key
# and the GPG key that dotfiles reads during activation.
ssh:
  enabled: true
  existingSecret: festie-secrets

# festie's 10Gi, on the 16 GB node it no longer shares (festie was retired
# on 5 Oct 2026). Reaching the cap kills the whole container, every agent and
# terminal with it, not only the largest process: kubelet sets
# memory.oom.group on cgroup v2, and the pod cannot swap.
#
# The CPU request fits: the node's requests sat at 3805m of 6000m on 29 Sep.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 10Gi

# dshm cannot outlive the pod, and home is regenerable state whose durable parts live
# elsewhere, so neither belongs in the nightly backup. ndots:1 because every
# external lookup otherwise walks five search domains first.
podAnnotations:
  backup.velero.io/backup-volumes-excludes: "dshm,home"

dnsConfig:
  options:
    - name: ndots
      value: "1"

# Pinned to the control plane from the very first deploy. nodeSelector {} does
# NOT mean "the main node": the scheduler once put itineris on the Rishra
# worker, its local-path claim bound there, and the site went down with that
# node.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
