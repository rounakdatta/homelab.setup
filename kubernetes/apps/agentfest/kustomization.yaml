---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# The Paseo computer. A release of the same chart as festie (../festie), from
# 0.2.0 on: same image lineage, same dotfiles environment, but its own home
# volume and no ingress at all. It is reached through Paseo's end-to-end
# encrypted relay, which the daemon dials out to.
helmCharts:
  - name: agentfest
    repo: oci://ghcr.io/rounakdatta/charts
    version: 0.2.3
    releaseName: agentfest
    namespace: apps
    valuesFile: values.yaml

resources:
  - networkpolicy.yaml
