---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# One release is one computer. `festie` is the first; further computers are
# additional releases of this same chart with their own PVCs and hostnames.
helmCharts:
  - name: agentfest
    repo: oci://ghcr.io/rounakdatta/charts
    version: 0.1.34
    releaseName: festie
    namespace: apps
    valuesFile: values.yaml

resources:
  - ingress.yaml
  - networkpolicy.yaml

# `dshm` is an emptyDir (shared memory for the browser). Its contents cannot
# outlive the pod, so a file-system backup of it is never meaningful — and
# Velero logs a "pod is not running" warning for it against every completed or
# evicted festie pod it finds, which is where most of our backup warnings came
# from. The chart has no podAnnotations value, hence the patch.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: festie
      spec:
        template:
          metadata:
            annotations:
              backup.velero.io/backup-volumes-excludes: "dshm"
