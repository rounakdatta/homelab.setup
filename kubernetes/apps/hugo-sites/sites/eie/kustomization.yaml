# Everything is Everything, the podcast archive, set as a newspaper: eie.taptappers.club.
# The site lives in rounakdatta/eie and this serves a tag of it. Unlike the Hugo sites, which
# follow a branch, it is pinned: to publish a new version, tag eie site-vX.Y.Z and set BRANCH below.
# The fetch is a blobless sparse clone of site/ only (~230 MB: 128 editions with their pictures and
# films; the rest of the repo is transcripts), and eie's own site/publish.sh gathers what is served, as
# it does for GitHub Pages.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - nginx-config.yaml
  - desk.yaml

namespace: sites
namePrefix: eie-

patches:
  # Set site-specific labels and env vars, the fetch, and its own nginx config. Keep it on the control plane, the node
  # that is always there, with no CPU request: the control plane's CPU requests are full (its
  # CPU isn't), and a CPU limit left alone would be copied into the request.
  - target:
      kind: Deployment
      name: static-site
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: eie
      - op: replace
        path: /spec/template/metadata/labels/app
        value: eie
      - op: replace
        path: /spec/template/spec/initContainers/0/env/0/value
        value: https://github.com/rounakdatta/eie
      - op: replace
        path: /spec/template/spec/initContainers/0/env/1/value
        value: site-v0.2.1
      - op: replace
        path: /spec/template/spec/initContainers/0/env/2/value
        value: site
      - op: replace
        path: /spec/template/spec/initContainers/0/args/0
        value: |
          set -e
          git clone --depth 1 --filter=blob:none --sparse --branch "${BRANCH}" "${REPO}" /repo
          git -C /repo sparse-checkout set "${SERVE_DIR}"
          sh "/repo/${SERVE_DIR}/publish.sh" /output
          # the search's own files, where the tag has them (an older tag, rolled back to, has none)
          if [ -d "/repo/${SERVE_DIR}/search" ]; then cp -r "/repo/${SERVE_DIR}/search/." /desk/; fi
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: nginx
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: "true"
      - op: remove
        path: /spec/template/spec/containers/0/resources/requests/cpu
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
      # Lost & Found, the archive's search: eie's site/search/server.py beside nginx, on the files nginx
      # serves (read-only) and the search's own files (copied by the fetch above). Standard library only,
      # so a stock Python image. The key is auth2api's, copied into this namespace by the Bitwarden sync
      # (ansible/playbook.yml: eie-search-credentials); without it the desk answers by words alone. No
      # readiness probe: the desk is a guest in the pod, and a desk that fails must not take the paper
      # down with it.
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: desk
          emptyDir: {}
      - op: add
        path: /spec/template/spec/initContainers/0/volumeMounts/-
        value:
          name: desk
          mountPath: /desk
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: desk
          image: python:3.13-alpine
          # never exits: a pod is Ready only when all its containers are, so a desk that crashed (or a tag
          # without one) would take the paper out of service. The loop restarts it instead; meanwhile
          # nginx answers /api/ with a 502 and the page says the desk is closed.
          command: ["sh", "-c", "while :; do [ -f /desk/server.py ] && python3 -u /desk/server.py; echo 'the desk is closed; again in 30 s'; sleep 30; done"]
          env:
            - name: SITE
              value: /site
            - name: HOOKS
              value: /desk/hooks
            - name: AUTH2API_KEY
              valueFrom:
                secretKeyRef:
                  name: eie-search-credentials
                  key: api-key
                  optional: true
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: content
              mountPath: /site
              readOnly: true
            - name: desk
              mountPath: /desk
              readOnly: true
          resources:
            requests:
              memory: "96Mi"
            limits:
              memory: "256Mi"

  # Set site-specific selector
  - target:
      kind: Service
      name: static-site
    patch: |-
      - op: replace
        path: /spec/selector/app
        value: eie

  # Set hostname and TLS
  - target:
      kind: Ingress
      name: static-site
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: eie.taptappers.club
      - op: replace
        path: /spec/tls/0/hosts/0
        value: eie.taptappers.club
      - op: replace
        path: /spec/tls/0/secretName
        value: eie-tls
