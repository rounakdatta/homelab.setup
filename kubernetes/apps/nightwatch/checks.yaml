# What the prober checks, from inside the cluster. Every result is pushed,
# signed, to the watcher on Cloudflare (rounakdatta/nightwatch), which
# alerts when a check stays bad for `for`, or when the pushes stop.
#
# Reasons that leave the cluster carry status codes and numbers only, never
# hostnames or bodies (see prober/check.go). Values: http checks report their
# response time; prom and json checks report what `value`/`age`/`until` says,
# in seconds when unit is s. Thresholds take numbers or durations.
#
# Apps need no entry here to be watched: `discover` (at the end) gives every
# Service an Ingress routes to a check of its own, and names any workload no
# check reaches. Write a check here when an app needs more than "it answers".
agent: homelab
push:
  url: https://watch.taptappers.club/v1/push
  every: 60s
  key_file: /secrets/signing/seed

# ---- Nodes: is every machine up, and how loaded is it? ----------------------
# Each node and whether Kubernetes calls it Ready, from the API (the token may
# list nodes and nothing else, rbac.yaml), and its CPU, RAM and disk from the
# node agent on it (nodes.yaml). Pushed as one result per node, named by the
# node; a node that stays not ready for `for` alerts. Where each node is comes
# from the labels the inventory gives it (deploy-infra.yml), read hourly.
# A node's disk warns once it is `full_at` % full, or when the last week's
# trend fills it within `fills_within` ("disk sda2 fills about Thu 10 Dec at
# 1.8 GB a day (81% full)"); the trend needs a week of readings after an
# agent starts (until then only the level speaks). Added after kanmani sat at
# 81-83% on 24 Nov 2026.
nodes:
  api: https://kubernetes.default.svc
  bearer_file: /secrets/kube/token
  ca_file: /secrets/kube/ca.crt
  agents: nightwatch-node.apps.svc.cluster.local:8080
  place: [homelab.setup/city, homelab.setup/region]
  every: 1m
  timeout: 10s
  for: 3m
  disk: {fills_within: 14d, full_at: 90}

checks:
  # ---- Agentfest: is the Paseo computer up? ---------------------------------
  # Paseo listens on its own pod's loopback and has no Service, so it is judged
  # by its pod's readiness (the readiness probe asks Paseo's /api/health), read
  # from the Kubernetes API with a token that may get this one Deployment and
  # nothing else (rbac.yaml). Every 15 s, so a deploy's downtime is measured to
  # the quarter minute; Kubernetes leaves readyReplicas out when it is 0.
  - id: agentfest-paseo
    name: Paseo daemon
    group: agentfest
    every: 15s
    timeout: 10s
    for: 5m
    unit: ""
    absent: fail
    fail_below: 1
    fail_reason: no ready pod
    display: {yes: ready, no: no ready pod}
    json:
      url: https://kubernetes.default.svc/apis/apps/v1/namespaces/apps/deployments/agentfest
      bearer_file: /secrets/kube/token
      ca_file: /secrets/kube/ca.crt
      value: $.status.readyReplicas

  # ---- aiapi: is the Claude behind the gateway really answering? -------------
  # /health says ok even when the login is dead, so ask Anthropic instead.
  # count_tokens goes upstream with the OAuth token and generates nothing.
  - id: aiapi-session
    name: Claude login accepted
    group: aiapi
    every: 5m
    timeout: 30s
    for: 10m
    http:
      method: POST
      url: http://auth2api.apps.svc.cluster.local:8317/v1/messages/count_tokens
      headers: {anthropic-version: "2023-06-01", content-type: application/json}
      header_files: {x-api-key: /secrets/aiapi/api-key}
      body: '{"model":"claude-haiku-5-5","messages":[{"role":"user","content":"ping"}]}'
      expect_json_has: [$.input_tokens]
      # Rate-limited is degraded, not logged out: the account's usage window
      # is spent and comes back on its own.
      warn_status: [429]
    warn_above: 5s

  # The whole path, once an hour: one generated token from the cheapest model.
  - id: aiapi-generate
    name: 1-token reply
    group: aiapi
    every: 1h
    timeout: 60s
    for: 90m
    http:
      method: POST
      url: http://auth2api.apps.svc.cluster.local:8317/v1/messages
      headers: {anthropic-version: "2023-06-01", content-type: application/json}
      header_files: {x-api-key: /secrets/aiapi/api-key}
      body: '{"model":"claude-haiku-5-5","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}'
      expect_json: {$.stop_reason: max_tokens}
      warn_status: [429]
    warn_above: 15s

  # Both of the gateway's Claude accounts are loaded: with one, a rate limit
  # on it has nowhere to go (auth2api's seed-account, values.yaml).
  - id: aiapi-accounts
    name: Accounts loaded
    group: aiapi
    every: 10m
    for: 30m
    unit: ""
    display: {template: "{v} of 2"}
    json:
      url: http://auth2api.apps.svc.cluster.local:8317/admin/accounts
      value: $.providers.anthropic.account_count
    warn_below: 2
    fail_below: 1
    warn_reason: one account is missing, so a rate limit has nowhere to go
    fail_reason: no account loaded

  # The seeded logins have no refresh token: when one lapses, only a new
  # setup-token fixes it. Warn a month ahead.
  - id: aiapi-login-expiry
    name: First login expires in
    group: aiapi
    display: {template: "in {v}"}
    every: 1h
    # One failed read must not stand as an alert for hours.
    for: 3h
    json:
      url: http://auth2api.apps.svc.cluster.local:8317/admin/accounts
      until: $.providers.anthropic.accounts[0].expiresAt
    warn_below: 30d
    fail_below: 3d

  - id: aiapi-login-expiry-2
    name: Second login expires in
    group: aiapi
    display: {template: "in {v}"}
    every: 1h
    # One failed read must not stand as an alert for hours.
    for: 3h
    json:
      url: http://auth2api.apps.svc.cluster.local:8317/admin/accounts
      until: $.providers.anthropic.accounts[1].expiresAt
    warn_below: 30d
    fail_below: 3d

  # ---- Velero (the watcher also reads the backup itself in R2) ---------------
  # The timestamp reads 0 until the first backup after a Velero restart:
  # ignore_zero turns that into "unknown" instead of "54 years old".
  - id: velero-nightly-age
    name: Velero nightly, last success
    group: backups
    display: {template: "{v} ago"}
    every: 10m
    for: 25m
    unit: s
    prom:
      url: http://velero.velero.svc.cluster.local:8085/metrics
      value: age(velero_backup_last_successful_timestamp{schedule="nightly-full-backup"})
      ignore_zero: true
    warn_above: 26h
    fail_above: 50h

  - id: velero-nightly-result
    name: Velero nightly, last result
    group: backups
    display: {yes: completed, no: did not complete}
    every: 10m
    for: 25m
    unit: bool
    prom:
      url: http://velero.velero.svc.cluster.local:8085/metrics
      value: velero_backup_last_status{schedule="nightly-full-backup"}
    fail_below: 1
    fail_reason: the last nightly backup did not complete

  # ---- Zepp: does the archive keep up with what Zepp has? --------------------
  - id: zepp-sync
    name: Last successful sync
    group: zepp
    display: {template: "{v} ago"}
    every: 5m
    for: 10m
    unit: s
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      # The oldest success across every data type: one failing type can't
      # hide behind the healthy ones.
      value: time() - min(zepp_sync_last_success_timestamp_seconds)
    fail_above: 15m

  # A data type that has never succeeded has no success timestamp at all, so
  # the check above can't see it; its failure flag can.
  - id: zepp-sync-failing
    name: Every data type syncing
    group: zepp
    display: {yes: a type is failing, no: all syncing}
    every: 5m
    for: 15m
    unit: bool
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: max(zepp_sync_last_attempt_failed)
    fail_above: 0
    fail_reason: a data type's last sync failed

  # Zepp has a newer day than the archive: the sync is losing data.
  - id: zepp-archive-behind
    name: Archive lag behind Zepp
    group: zepp
    display: {zero: in step, template: "{v} behind"}
    every: 5m
    for: 30m
    unit: s
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: max(zepp_upstream_newest_day_timestamp_seconds) - max(zepp_archive_newest_day_timestamp_seconds{data_type="daily_activity"})
    fail_above: 0

  # Zepp itself has nothing new: the phone isn't uploading. Not a sync fault.
  # Measured at the moment Zepp last confirmed its newest day, so the number
  # freezes while Zepp can't be asked (a dead apptoken has its own check)
  # instead of growing into a false "phone stopped uploading".
  - id: zepp-phone-upload
    name: Newest day from the phone
    group: zepp
    display: {template: "{v} old"}
    every: 10m
    for: 30m
    unit: s
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: max(zepp_upstream_newest_day_confirmed_timestamp_seconds) - max(zepp_upstream_newest_day_timestamp_seconds)
    warn_above: 60h

  # The apptoken is a browser cookie and expires; the sync dies with it.
  - id: zepp-apptoken
    name: Apptoken accepted
    group: zepp
    display: {yes: accepted, no: rejected}
    every: 10m
    for: 30m
    unit: bool
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: zepp_upstream_probe_ok
    fail_below: 1
    fail_reason: Zepp rejected the apptoken (renew it from the browser)

  # ---- Doors: Traefik's tailnet door and tinyauth's forward-auth -------------
  # A pod reaches the tailnet door by its public name (kube-proxy matches the
  # externalIP), so this walks the same Traefik router a laptop does.
  - id: door-tailnet
    name: Tailnet door (Traefik, tinyauth)
    group: doors
    every: 1m
    for: 3m
    http: {url: "https://auth.taptappers.club/api/healthz"}
    warn_above: 2s

  # 401 means forward-auth is guarding: a 200 here would be the alarm.
  - id: door-forward-auth
    name: Forward-auth guards private apps
    group: doors
    every: 5m
    for: 10m
    http: {url: "https://synt.taptappers.club/", expect_status: [401]}

  # ---- Apps: each Service answers -------------------------------------------
  - {id: app-audiobookshelf, name: Audiobookshelf, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://audiobookshelf.taptappers.club/'},
     http: {url: "http://audiobookshelf.apps.svc.cluster.local/healthcheck"}}
  - {id: app-aiapi, name: aiapi gateway, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {repo: rounakdatta/auth2api, link: 'https://aiapi.taptappers.club/admin/accounts'},
     http: {url: "http://auth2api.apps.svc.cluster.local:8317/health"}}
  - id: app-bookstack
    name: BookStack
    group: apps
    every: 1m
    for: 3m
    warn_above: 3s
    display: {link: 'https://bookstack.taptappers.club/'}
    http:
      url: http://bookstack.apps.svc.cluster.local:8080/status
      expect_json: {$.database: true, $.cache: true, $.session: true}
  - {id: app-firefly, name: Firefly III, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://firefly.taptappers.club/'},
     http: {url: "http://firefly.apps.svc.cluster.local:8080/health"}}
  - {id: app-fold, name: fold, group: apps, every: 5m, for: 10m, warn_above: 5s,
     display: {repo: rounakdatta/texas-fold-em, link: 'https://fold.taptappers.club/'},
     http: {url: "http://texas-fold-em.apps.svc.cluster.local:8080/"}}
  # fold signs in to fold.money with a refresh token that texas-fold-em renews
  # every ~13 minutes (each access token lives 15). If fold refuses it (a
  # sign-in elsewhere revokes it), nothing syncs until it is re-seeded with
  # POST /init. /health then answers 503, which fails this at once (its body
  # can't be trusted: the refusal stamps updated_at); if the renewals merely
  # stop, the age passes 17 minutes.
  - id: fold-token
    name: fold token
    group: apps
    every: 5m
    for: 10m
    display: {template: "renewed {v} ago", repo: rounakdatta/texas-fold-em}
    json:
      url: http://texas-fold-em.apps.svc.cluster.local:8080/health
      age: $.updated_at
    fail_above: 17m
    fail_reason: fold has stopped renewing it
  - {id: app-frigate, name: Frigate, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://home-cam.taptappers.club/'},
     http: {url: "http://frigate.apps.svc.cluster.local:5000/api/version"}}
  - {id: app-home-assistant, name: Home Assistant, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://home-assistant.taptappers.club/'},
     http: {url: "http://home-assistant.apps.svc.cluster.local:8123/manifest.json"}}
  - {id: app-itineris, name: itineris, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {repo: rounakdatta/itineris, link: 'https://itineris.taptappers.club/'},
     http: {url: "http://itineris.apps.svc.cluster.local/"}}
  - {id: app-itineris-creator, name: itineris creator, group: apps, every: 5m, for: 10m, warn_above: 3s,
     display: {repo: rounakdatta/itineris, link: 'https://itineris.taptappers.club/creator'},
     http: {url: "http://itineris-admin.apps.svc.cluster.local/creator", expect_status: [302]}}
  - {id: app-lezepplean, name: LeZeppLean, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {repo: rounakdatta/le-zepp-lean, link: 'https://lezepplean.taptappers.club/'},
     http: {url: "http://lezepplean.apps.svc.cluster.local:8787/"}}
  - {id: app-memoet, name: Memoet, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://memoet.taptappers.club/'},
     http: {url: "http://memoet.apps.svc.cluster.local:4000/"}}
  - id: app-nextcloud
    name: Nextcloud
    group: apps
    every: 1m
    for: 3m
    warn_above: 3s
    display: {link: 'https://nextcloud.taptappers.club/'}
    http:
      url: http://nextcloud.apps.svc.cluster.local/status.php
      headers: {Host: nextcloud.taptappers.club}
      expect_json: {$.installed: true, $.maintenance: false, $.needsDbUpgrade: false}
  # The Obsidian vault Nextcloud shows as /Obsidian, kept in step with the Mac and the
  # phone by the syncthing sidecar. in_step_at is the last time it and a device were
  # connected and fully in step; it is left out while the folder is broken or Syncthing
  # is not answering, which fails the check at once.
  - id: obsidian-sync
    name: Obsidian sync
    group: apps
    every: 5m
    for: 15m
    json:
      url: http://nextcloud-syncthing-status.apps.svc.cluster.local:8385/
      age: $.in_step_at
    absent: fail
    warn_above: 12h
    warn_reason: no device has synced with it for 12 hours
    fail_above: 36h
    fail_reason: the server's copy of the vault is not syncing
    display: {template: "in step {v} ago", link: 'https://nextcloud.taptappers.club/apps/files/?dir=/Obsidian'}
  - {id: app-snibox, name: Snibox, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://snibox.taptappers.club/'},
     http: {url: "http://snibox.apps.svc.cluster.local:3000/", expect_status: [302]}}
  - {id: app-synt, name: synt, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {repo: rounakdatta/synt, link: 'https://synt.taptappers.club/'},
     http: {url: "http://synt.apps.svc.cluster.local:8080/healthz"}}
  - {id: app-tinyauth, name: tinyauth, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://auth.taptappers.club/'},
     http: {url: "http://tinyauth.tinyauth.svc.cluster.local:3000/api/healthz"}}
  - {id: app-velero-ui, name: Velero UI, group: apps, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://velero-ui.velero.svc.cluster.local:3000/"}}
  - {id: app-keel, name: Keel, group: apps, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://keel.kube-system.svc.cluster.local:9300/healthz"}}
  - id: app-vikunja
    name: Vikunja
    group: apps
    every: 1m
    for: 3m
    warn_above: 3s
    display: {link: 'https://vikunja.taptappers.club/'}
    http:
      url: http://vikunja.apps.svc.cluster.local:3456/api/v1/info
      expect_json_has: [$.version]
  - {id: app-warren, name: Warren hub, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {repo: rounakdatta/warren, link: 'https://warren.taptappers.club/'},
     http: {url: "http://warren-hub.apps.svc.cluster.local:9000/", expect_status: [401]}}
  # Workers with no Service are read from the API, as agentfest's pod is (the
  # token may get any Deployment, rbac.yaml): at least one pod ready, over 10
  # minutes so a rollout or a node's short blip stays quiet.
  - id: app-warren-node
    name: Warren exit node (pxin)
    group: apps
    every: 1m
    for: 10m
    unit: ""
    absent: fail
    fail_below: 1
    fail_reason: no ready pod
    display: {yes: ready, no: no ready pod, repo: rounakdatta/warren}
    json:
      url: https://kubernetes.default.svc/apis/apps/v1/namespaces/apps/deployments/warren-node
      bearer_file: /secrets/kube/token
      ca_file: /secrets/kube/ca.crt
      value: $.status.readyReplicas
  - id: app-towerofhn-runners
    name: Tower of HN voice runners
    group: apps
    every: 1m
    for: 10m
    unit: ""
    absent: fail
    fail_below: 1
    fail_reason: no ready runner
    display: {template: "{v} ready", repo: rounakdatta/tower-of-hn.io}
    json:
      url: https://kubernetes.default.svc/apis/apps/v1/namespaces/apps/deployments/towerofhan-runner
      bearer_file: /secrets/kube/token
      ca_file: /secrets/kube/ca.crt
      value: $.status.readyReplicas
  - {id: app-webtrees, name: webtrees, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {link: 'https://webtrees.taptappers.club/'},
     http: {url: "http://webtrees.apps.svc.cluster.local/", expect_status: [302]}}
  - {id: app-zepp, name: Zepp MCP, group: apps, every: 1m, for: 3m, warn_above: 3s,
     display: {repo: rounakdatta/zepp-life-mcp},
     http: {url: "http://zepp-life-mcp.apps.svc.cluster.local/healthz"}}
  - {id: site-eie, name: eie, group: sites, every: 5m, for: 10m, warn_above: 3s,
     display: {repo: rounakdatta/eie, link: 'https://eie.taptappers.club/'},
     http: {url: "http://eie-static-site.sites.svc.cluster.local/"}}
  - {id: site-rounak2018, name: rounak2018, group: sites, every: 5m, for: 10m, warn_above: 3s,
     display: {repo: rounakdatta/rounakdatta.github.io/tree/2018, link: 'https://rounak2018.taptappers.club/'},
     http: {url: "http://rounak2018-static-site.sites.svc.cluster.local/"}}
  - {id: site-rounak2020, name: rounak2020, group: sites, every: 5m, for: 10m, warn_above: 3s,
     display: {repo: rounakdatta/rounakdatta.github.io/tree/2020, link: 'https://rounak2020.taptappers.club/'},
     http: {url: "http://rounak2020-static-site.sites.svc.cluster.local/"}}
  - {id: site-rounak2025, name: rounak2025, group: sites, every: 5m, for: 10m, warn_above: 3s,
     display: {repo: rounakdatta/rounakdatta.github.io/tree/2025, link: 'https://rounak2025.taptappers.club/'},
     http: {url: "http://rounak2025-static-site.sites.svc.cluster.local/"}}

# ---- Discovery: nothing runs unwatched ------------------------------------
# Every 2 minutes the prober lists the cluster (rbac.yaml: get and list
# Ingresses, Services and workloads, nothing else):
# - every Service an Ingress routes to that no check above calls gets a check
#   of its own: GET the Service at the Ingress's path every minute, up while
#   it answers below 500, alerting after 3 minutes, in Apps, named after the
#   host. nightwatch/* annotations on the Ingress tune it (name, group, path,
#   expect, every, for, repo); see rounakdatta/nightwatch's README.
# - every Deployment, StatefulSet and DaemonSet must be reached by some check
#   (a Service that selects it, or the API), or say why it needs none: the
#   annotation `nightwatch/unmonitored: <why>` on it, or, for what this repo
#   doesn't write itself, a line below. The row "Every workload monitored"
#   names the rest and warns after `for`.
# Dry run: `prober -discover -config checks.yaml [-manifest rendered.yaml]`.
discover:
  api: https://kubernetes.default.svc
  bearer_file: /secrets/kube/token
  ca_file: /secrets/kube/ca.crt
  every: 2m
  for: 30m
  report_only: true   # stage 1 of the rollout: -discover reports, nothing is pushed yet
  ignore:
    kube-system: k3s's own add-ons (Traefik, CoreDNS, local-path, metrics-server); the doors go through Traefik and every check needs CoreDNS
    cert-manager: issues the certificates; no page of its own, and a renewal stuck for weeks would show as an expired certificate
    databases: shared databases; each app that uses one fails its own check when it is down
    velero/node-agent: Velero's file-system backup agent; the nightly backup checks fail when it does
    authelia/authelia: left over from before tinyauth (#105, May 2026), not in this repo any more; delete it or adopt it
    apps/applet: experimental (applet); its controller has not become ready yet. Give it a check when it is in use
    apps/applet-phone-rounak: experimental (applet); see apps/applet
