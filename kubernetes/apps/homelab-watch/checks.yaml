# What the prober checks, from inside the cluster. Every result is pushed,
# signed, to the watcher on Cloudflare (rounakdatta/homelab-watch), which
# alerts when a check stays bad for `for`, or when the pushes stop.
#
# Reasons that leave the cluster carry status codes and numbers only, never
# hostnames or bodies (see prober/check.go). Values: http checks report their
# response time; prom and json checks report what `value`/`age`/`until` says,
# in seconds when unit is s. Thresholds take numbers or durations.
agent: homelab
push:
  url: https://watch.taptappers.club/v1/push
  every: 60s
  key_file: /secrets/signing/seed

checks:
  # ---- aiapi: is the Claude behind the gateway really answering? -------------
  # /health says ok even when the login is dead, so ask Anthropic instead.
  # count_tokens goes upstream with the OAuth token and generates nothing.
  - id: aiapi-session
    name: Claude login accepted
    group: aiapi
    every: 5m
    timeout: 30s
    for: 10m
    http:
      method: POST
      url: http://auth2api.apps.svc.cluster.local:8317/v1/messages/count_tokens
      headers: {anthropic-version: "2023-06-01", content-type: application/json}
      header_files: {x-api-key: /secrets/aiapi/api-key}
      body: '{"model":"claude-haiku-5-5","messages":[{"role":"user","content":"ping"}]}'
      expect_json_has: [$.input_tokens]
      # Rate-limited is degraded, not logged out: the account's usage window
      # is spent and comes back on its own.
      warn_status: [429]
    warn_above: 5s

  # The whole path, once an hour: one generated token from the cheapest model.
  - id: aiapi-generate
    name: 1-token reply
    group: aiapi
    every: 1h
    timeout: 60s
    for: 90m
    http:
      method: POST
      url: http://auth2api.apps.svc.cluster.local:8317/v1/messages
      headers: {anthropic-version: "2023-06-01", content-type: application/json}
      header_files: {x-api-key: /secrets/aiapi/api-key}
      body: '{"model":"claude-haiku-5-5","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}'
      expect_json: {$.stop_reason: max_tokens}
      warn_status: [429]
    warn_above: 15s

  # The seeded login has no refresh token: when it lapses, only a real
  # `--login` fixes it. Warn a month ahead.
  - id: aiapi-login-expiry
    name: Login expires in
    group: aiapi
    every: 1h
    # One failed read must not stand as an alert for hours.
    for: 3h
    json:
      url: http://auth2api.apps.svc.cluster.local:8317/admin/accounts
      until: $.providers.anthropic.accounts[0].expiresAt
    warn_below: 30d
    fail_below: 3d

  # ---- Velero (the watcher also reads the backup itself in R2) ---------------
  # The timestamp reads 0 until the first backup after a Velero restart:
  # ignore_zero turns that into "unknown" instead of "54 years old".
  - id: velero-nightly-age
    name: Velero nightly, last success
    group: backups
    every: 10m
    for: 25m
    unit: s
    prom:
      url: http://velero.velero.svc.cluster.local:8085/metrics
      value: age(velero_backup_last_successful_timestamp{schedule="nightly-full-backup"})
      ignore_zero: true
    warn_above: 26h
    fail_above: 50h

  - id: velero-nightly-result
    name: Velero nightly, last result
    group: backups
    every: 10m
    for: 25m
    unit: bool
    prom:
      url: http://velero.velero.svc.cluster.local:8085/metrics
      value: velero_backup_last_status{schedule="nightly-full-backup"}
    fail_below: 1
    fail_reason: the last nightly backup did not complete

  # ---- Zepp: does the archive keep up with what Zepp has? --------------------
  - id: zepp-sync
    name: Last successful sync
    group: zepp
    every: 5m
    for: 10m
    unit: s
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      # The oldest success across every data type: one failing type can't
      # hide behind the healthy ones.
      value: time() - min(zepp_sync_last_success_timestamp_seconds)
    fail_above: 15m

  # A data type that has never succeeded has no success timestamp at all, so
  # the check above can't see it; its failure flag can.
  - id: zepp-sync-failing
    name: Every data type syncing
    group: zepp
    every: 5m
    for: 15m
    unit: bool
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: max(zepp_sync_last_attempt_failed)
    fail_above: 0
    fail_reason: a data type's last sync failed

  # Zepp has a newer day than the archive: the sync is losing data.
  - id: zepp-archive-behind
    name: Archive lag behind Zepp
    group: zepp
    every: 5m
    for: 30m
    unit: s
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: max(zepp_upstream_newest_day_timestamp_seconds) - max(zepp_archive_newest_day_timestamp_seconds{data_type="daily_activity"})
    fail_above: 0

  # Zepp itself has nothing new: the phone isn't uploading. Not a sync fault.
  # Measured at the moment Zepp last confirmed its newest day, so the number
  # freezes while Zepp can't be asked (a dead apptoken has its own check)
  # instead of growing into a false "phone stopped uploading".
  - id: zepp-phone-upload
    name: Newest day from the phone
    group: zepp
    every: 10m
    for: 30m
    unit: s
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: max(zepp_upstream_newest_day_confirmed_timestamp_seconds) - max(zepp_upstream_newest_day_timestamp_seconds)
    warn_above: 60h

  # The apptoken is a browser cookie and expires; the sync dies with it.
  - id: zepp-apptoken
    name: Apptoken accepted
    group: zepp
    every: 10m
    for: 30m
    unit: bool
    prom:
      url: http://zepp-life-mcp.apps.svc.cluster.local/metrics
      value: zepp_upstream_probe_ok
    fail_below: 1
    fail_reason: Zepp rejected the apptoken (renew it from the browser)

  # ---- Doors: Traefik's tailnet door and tinyauth's forward-auth -------------
  # A pod reaches the tailnet door by its public name (kube-proxy matches the
  # externalIP), so this walks the same Traefik router a laptop does.
  - id: door-tailnet
    name: Tailnet door (Traefik, tinyauth)
    group: doors
    every: 1m
    for: 3m
    http: {url: "https://auth.taptappers.club/api/healthz"}
    warn_above: 2s

  # 401 means forward-auth is guarding: a 200 here would be the alarm.
  - id: door-forward-auth
    name: Forward-auth guards private apps
    group: doors
    every: 5m
    for: 10m
    http: {url: "https://synt.taptappers.club/", expect_status: [401]}

  # ---- Apps: each Service answers -------------------------------------------
  - {id: app-audiobookshelf, name: Audiobookshelf, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://audiobookshelf.apps.svc.cluster.local/healthcheck"}}
  - {id: app-aiapi, name: aiapi gateway, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://auth2api.apps.svc.cluster.local:8317/health"}}
  - id: app-bookstack
    name: BookStack
    group: apps
    every: 1m
    for: 3m
    warn_above: 3s
    http:
      url: http://bookstack.apps.svc.cluster.local:8080/status
      expect_json: {$.database: true, $.cache: true, $.session: true}
  - {id: app-firefly, name: Firefly III, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://firefly.apps.svc.cluster.local:8080/health"}}
  - {id: app-fold, name: fold, group: apps, every: 5m, for: 10m, warn_above: 5s,
     http: {url: "http://texas-fold-em.apps.svc.cluster.local:8080/"}}
  - {id: app-frigate, name: Frigate, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://frigate.apps.svc.cluster.local:5000/api/version"}}
  - {id: app-home-assistant, name: Home Assistant, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://home-assistant.apps.svc.cluster.local:8123/manifest.json"}}
  - {id: app-itineris, name: itineris, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://itineris.apps.svc.cluster.local/"}}
  - {id: app-itineris-creator, name: itineris creator, group: apps, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://itineris-admin.apps.svc.cluster.local/creator", expect_status: [302]}}
  - {id: app-lezepplean, name: LeZeppLean, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://lezepplean.apps.svc.cluster.local:8787/"}}
  - {id: app-memoet, name: Memoet, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://memoet.apps.svc.cluster.local:4000/"}}
  - id: app-nextcloud
    name: Nextcloud
    group: apps
    every: 1m
    for: 3m
    warn_above: 3s
    http:
      url: http://nextcloud.apps.svc.cluster.local/status.php
      headers: {Host: nextcloud.taptappers.club}
      expect_json: {$.installed: true, $.maintenance: false, $.needsDbUpgrade: false}
  - {id: app-snibox, name: Snibox, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://snibox.apps.svc.cluster.local:3000/", expect_status: [302]}}
  - {id: app-synt, name: synt, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://synt.apps.svc.cluster.local:8080/healthz"}}
  - {id: app-tinyauth, name: tinyauth, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://tinyauth.tinyauth.svc.cluster.local:3000/api/healthz"}}
  - {id: app-velero-ui, name: Velero UI, group: apps, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://velero-ui.velero.svc.cluster.local:3000/"}}
  - {id: app-keel, name: Keel, group: apps, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://keel.kube-system.svc.cluster.local:9300/healthz"}}
  - id: app-vikunja
    name: Vikunja
    group: apps
    every: 1m
    for: 3m
    warn_above: 3s
    http:
      url: http://vikunja.apps.svc.cluster.local:3456/api/v1/info
      expect_json_has: [$.version]
  - {id: app-warren, name: Warren hub, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://warren-hub.apps.svc.cluster.local:9000/", expect_status: [401]}}
  - {id: app-webtrees, name: webtrees, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://webtrees.apps.svc.cluster.local/", expect_status: [302]}}
  - {id: app-zepp, name: Zepp MCP, group: apps, every: 1m, for: 3m, warn_above: 3s,
     http: {url: "http://zepp-life-mcp.apps.svc.cluster.local/healthz"}}
  - {id: site-eie, name: eie, group: sites, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://eie-static-site.sites.svc.cluster.local/"}}
  - {id: site-rounak2018, name: rounak2018, group: sites, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://rounak2018-static-site.sites.svc.cluster.local/"}}
  - {id: site-rounak2020, name: rounak2020, group: sites, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://rounak2020-static-site.sites.svc.cluster.local/"}}
  - {id: site-rounak2025, name: rounak2025, group: sites, every: 5m, for: 10m, warn_above: 3s,
     http: {url: "http://rounak2025-static-site.sites.svc.cluster.local/"}}
