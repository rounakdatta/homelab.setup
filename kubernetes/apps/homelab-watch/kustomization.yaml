---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# homelab-watch's prober (rounakdatta/homelab-watch): runs checks.yaml from
# inside the cluster and pushes signed results to the watcher on Cloudflare
# (watch.taptappers.club), which alerts and serves the status page.
#
# It only connects outward: no Service, no Ingress, no Kubernetes token. Its
# only listener (/healthz, /status) is bound to the pod's loopback.
#
# Edit checks.yaml to add or change a check. The ConfigMap name carries a hash
# of it, so a change rolls the pod.
resources:
  - deployment.yaml

configMapGenerator:
  - name: homelab-watch-checks
    files:
      - checks.yaml
