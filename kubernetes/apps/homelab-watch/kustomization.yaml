---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# homelab-watch's prober (rounakdatta/homelab-watch): runs checks.yaml from
# inside the cluster and pushes signed results to the watcher on Cloudflare
# (watch.taptappers.club), which alerts and serves the status page.
#
# It only connects outward: no Service and no Ingress. Its Kubernetes
# permissions are reading the agentfest Deployment and listing the nodes
# (rbac.yaml). Its only listener (/healthz, /status) is bound to the pod's
# loopback.
#
# A node agent on every node (nodes.yaml) gives it each machine's CPU, RAM and
# disk: the same binary, answering only the prober.
#
# A second, separate prober reports the Claude accounts' usage from agentfest's
# account switcher (usage.yaml), so the cluster's own prober never depends on
# agentfest's volume.
#
# Edit checks.yaml (or claude-usage.yaml) to add or change a check. The
# ConfigMap name carries a hash of it, so a change rolls the pod.
resources:
  - rbac.yaml
  - deployment.yaml
  - usage.yaml
  - nodes.yaml

configMapGenerator:
  - name: homelab-watch-checks
    files:
      - checks.yaml
  - name: homelab-watch-usage
    files:
      - claude-usage.yaml
