---
# PUBLIC (websecure), and deliberately NOT behind tinyauth: the caller is the telly Android app, which sends
# `Authorization: Bearer <token>` and cannot complete a login redirect (the reason lezepplean gives too).
# Authentication is inside the application (Bitwarden telly/token, synced into telly-credentials).
#
# Only two paths are routed: /api (the app's API) and /livez (which says {"ok": true} and nothing else). Every
# other path, /admin included, gets Traefik's 404: the worker's admin server is reachable only inside the cluster,
# through the telly-admin Service, and the NetworkPolicy admits only agentfest to it.
#
# DNS: `A telly 173.234.14.113` in rounakdatta/oh-my-dns (zones/taptappers.club.txt), DNS-only like every other host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telly
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: apps-telly-ratelimit@kubernetescrd,apps-telly-inflight@kubernetescrd,apps-telly-body@kubernetescrd,apps-telly-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: telly.taptappers.club
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: telly
            port:
              number: 80
      - path: /livez
        pathType: Exact
        backend:
          service:
            name: telly
            port:
              number: 80
  tls:
  - hosts:
    - telly.taptappers.club
    secretName: telly-tls-secret
