---
# TAILNET-ONLY, and deliberately NOT behind tinyauth: the caller is the telly Android app, which sends
# `Authorization: Bearer <token>` and cannot complete a login redirect (the reason lezepplean and zepp-life-mcp give
# too). Authentication is inside the application: every route but /livez needs the token (Bitwarden telly/token,
# synced into telly-credentials). /livez answers {"ok": true} and nothing else.
#
# DNS: `A telly <control plane Tailscale address>` in rounakdatta/oh-my-dns (zones/taptappers.club.txt, the
# TAILNET-ONLY block).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telly
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: tailnet
spec:
  ingressClassName: traefik
  rules:
  - host: telly.taptappers.club
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: telly
            port:
              number: 80
  tls:
  - hosts:
    - telly.taptappers.club
    secretName: telly-tls-secret
