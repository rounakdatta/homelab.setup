---
# telly: the playlist canvas (rounakdatta/telly). Each day starts blank; the Android app says what the day holds and
# this server makes the music for it from Rounak's own listening history, writes the playlists into YouTube Music in
# the background, and adds a story to each.
#
# Plain manifests on an image built by the telly repo's CI (ghcr.io/rounakdatta/telly-server, code only). Bumping is
# one line: `image` in deployment.yaml.
#
# What lives on the volume, and how it gets there (none of it is in any repo or image):
#   catalog.db  the listening history the engine reads: built on agentfest by telly's tools/bake_catalog.py and
#               uploaded with PUT /admin/catalog
#   telly.db    every day's canvas and every version of each playlist, plus the YouTube Music session (POST /admin/ytm)
#               and, once connected, Spotify's (POST /admin/spotify)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
