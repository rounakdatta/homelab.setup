---
# On the control plane like the other apps with a local-path volume. Velero's file-system backup takes the volume
# by default: the canvases are worth keeping.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telly-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telly
  namespace: apps
  labels:
    app: telly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telly
  template:
    metadata:
      labels:
        app: telly
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: telly
        image: ghcr.io/rounakdatta/telly-server:sha-ad14336
        env:
        # The bearer token the app sends (Bitwarden telly/token). Without it the server refuses to start: a missing
        # token never means an open server.
        - name: TELLY_TOKEN
          valueFrom:
            secretKeyRef:
              name: telly-credentials
              key: token
        # Messages are read, and stories written, by Claude through auth2api, in-cluster (its key is already a
        # Secret in this namespace). Without it telly still works: rules read the common requests, no stories.
        - name: TELLY_LLM_URL
          value: http://auth2api.apps.svc.cluster.local:8317
        - name: TELLY_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: auth2api-credentials
              key: api-key
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /livez
            port: http
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        # ~100 MB resident with the 36k-song catalogue in memory.
        resources:
          requests:
            memory: "128Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: telly-data-pvc
      - name: tmp
        emptyDir: {}
