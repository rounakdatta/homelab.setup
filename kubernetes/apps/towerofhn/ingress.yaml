---
# PRIVATE for now: the tailnet door only, while it is tried on phones and laptops.
# Going public is both Ingresses' entrypoint (tailnet -> websecure) plus both DNS
# records (the Tailscale address -> the public one, proxied by Cloudflare) in oh-my-dns.
#
# DNS: `A towerofhn <kanmani's Tailscale address>` in rounakdatta/oh-my-dns
# (zones/taptappers.club.txt); without it the pod is healthy but unreachable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: towerofhn
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: tailnet
spec:
  ingressClassName: traefik
  rules:
  - host: towerofhn.taptappers.club
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: towerofhan
            port:
              number: 8787
  tls:
  - hosts:
    - towerofhn.taptappers.club
    secretName: towerofhn-tls-secret
---
# towerofhan.taptappers.club, the misspelling Tower of HN first went out under: a
# permanent redirect to the same path on towerofhn (middleware.yaml), so old links,
# bookmarks and home-screen icons keep working. Keep this Ingress, its certificate
# (towerofhan-tls-secret) and its DNS record (`A towerofhan`): those links need all three.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: towerofhan
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: tailnet
    traefik.ingress.kubernetes.io/router.middlewares: apps-towerofhn-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: towerofhan.taptappers.club
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: towerofhan
            port:
              number: 8787
  tls:
  - hosts:
    - towerofhan.taptappers.club
    secretName: towerofhan-tls-secret
