# Values for bjw-s app-template 5.1.0.
# Chart source: https://github.com/bjw-s-labs/helm-charts
#
# Tower of HN: the HN front page as a tower; every table a thread, voiced.
#
#   browser --(cached JSON + clips)--> Traefik --> web :8787 (towerd) ---- HN Firebase API, auth2api (tags)
#                                                   :8788 (voice port, in-cluster only)
#                                                     ^                ^
#                         runner (Kokoro lanes) on each worker node    voice (one fallback lane, beside the data)
#
# Both images are private (the repository is): pulled with the ghcr-pull Secret,
# rebuilt by deploy-stuff.yml from GHCR_READ_TOKEN, as for applet and lezepplean.

global:
  createDefaultServiceAccount: false

# Per-controller pod options must ADD to these (see warren).
defaultPodOptionsStrategy: merge

defaultPodOptions:
  # Neither process talks to the Kubernetes API.
  automountServiceAccountToken: false
  enableServiceLinks: false
  imagePullSecrets:
    - name: ghcr-pull
  annotations:
    # Everything on /data is rebuilt from HN and re-voiced on demand; none of it is
    # anyone's own. Keep it out of the nightly backup rather than ship audio to R2.
    backup.velero.io/backup-volumes-excludes: "data"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

controllers:
  towerofhan:
    # Names are pinned (here, on the Service and the PVC): kubectl apply never
    # prunes, so a rename would leave the old object running. That is why they keep
    # the misspelling the project first went out under (see kustomization.yaml).
    forceRename: towerofhan
    type: deployment
    replicas: 1
    # Recreate (app-template's default): /data is ReadWriteOnce, and towerd expects
    # to be the only one of its kind.
    pod:
      # local-path is node-local, and a public app must not land on the Rishra worker
      # (it drops offline): pinned to the control plane, as lezepplean and itineris are.
      # (Here, not in defaultPodOptions: the runners must be free of it, and a merged
      # map can't drop a key.)
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
    containers:
      web:
        image:
          repository: ghcr.io/rounakdatta/towerofhan-web
          tag: "0.5.16@sha256:8c64363f7e8a5aa3e2f3384698925c1ca43fad380afc34930da1ecd898fa2faf"
          pullPolicy: IfNotPresent
        env:
          VAR: /data
          # Audio is voiced again if it is ever wanted; stories leave the front page
          # within a day or two.
          RETENTION_DAYS: "7"
          # Which audio is kept (the app's docs/AUDIO.md): only what a floor on the tower
          # can still play, and for a day after it could; at most 1 GB; nothing new voiced
          # while the disk has under 15% free (tower-dry only logs what it would do; it
          # ran first, 25 Nov). Roll back: age (RETENTION_DAYS alone).
          AUDIO_POLICY: "tower"
          # Sponsoring (the app's apps/towerd/src/support.ts). Empty: nothing of it is in the
          # page, byte for byte. Set to the GitHub Sponsors page once GitHub has approved
          # the profile, https://github.com/sponsors/rounakdatta, and deploy: a quiet line
          # on the door, a credit at a table on wide screens, and /support. Only a
          # github.com/sponsors/<name> URL is accepted (anything else stays off, logged).
          # SPONSOR_UPI (a UPI ID, name@bank) would add a UPI line to /support.
          SPONSOR_URL: ""
          # Commenter cards (a one-line summary of someone's public comments, cached three
          # days per person) and the tags every comment is performed with (emotion,
          # stance, intensity, cues; one call per table batch): Claude Haiku through
          # auth2api, in-cluster. Runners hold no keys.
          AUTH2API_KEY:
            valueFrom:
              secretKeyRef:
                name: auth2api-credentials
                key: api-key
          # Pre-voicing while anyone has the page open (it yields to listeners at once):
          # deeper than the one-node defaults (6 floors, 4 tables, 14 turns), since the
          # runners on the workers voice ~6.5x real time between them.
          PREWARM_FLOORS: "8"
          PREWARM_TABLES: "6"
          PREWARM_TURNS: "16"
          # The voice port: runners claim comments here and send each clip back as it's
          # voiced; towerd stays the only writer of /data. Not on the ingress; the
          # NetworkPolicy admits the runners (and agentfest, for checks) only.
          VOICE_PORT: "8788"
          # The edge's way in (0.5.16): the Cloudflare Tunnel's connector (apps/cloudflared) reaches towerd here,
          # and only it (the NetworkPolicy). CF-Connecting-IP names each visitor on this port, so listener counts
          # and per-visitor limits work behind the CDN; /status is not served on it. Roll back: remove it.
          EDGE_PORT: "8790"
          # Voice everything on the tower ahead of listeners, as it arrives (0.5.13): the
          # runners' spare cores voice the whole front page (~15 h of speech; ~2 h to catch
          # up, then only new comments), so a listener finds a table voiced instead of
          # waiting on it. The standby beside the data takes only listeners and first words.
          # /status reports cover. Roll back: remove it (voicing as before: first words
          # everywhere, whole turns of the best tables while anyone has the page open).
          VOICE_AHEAD: "all"
          # How the room plays (the play flags, carried to every client in head.json): stream,
          # a comment plays from its first decoded clip; cue, whoever speaks next is called over
          # while the turn before is said, and nobody is waited on for long; quick, the first
          # voice comes 0.6 s after you sit, not 1.6 s. A/B on the live site, 26 Nov, same tables
          # (the app's tools/scale): first voice p95 2.64 -> 1.99 s desktop, 2.32 -> 1.54 s phone;
          # silences over 1.5 s too long 8 -> 0. Roll back: remove it, or drop one flag.
          # crowd (CROWD_V2, 0.5.15): a room that fits any crowd: tables keep a few people at
          # their front, everyone else stands in the audience (galleries above the room when a
          # floor needs them) and steps forward to speak; the camera never sits in the crowd.
          # timeline (needs crowd): at a table, a line along the bottom to scrub through the
          # conversation, watch people join it, and listen from any point (?t= links a moment).
          # floor (FLOOR_TIMELINE, 0.5.16; needs crowd): the floor is one building with every table and
          # everyone on it, and one line for the floor's own clock: drag it and the whole room goes
          # to that moment (people arrive with their first comment, leave an hour after their last),
          # let go and the floor plays from there in the order comments were written (?t= links it).
          # Roll back either: drop it from the list (a page can also try ?play=stream,cue,quick).
          CLIENT_FLAGS: "stream,cue,quick,crowd,timeline,floor"
        ports:
          - name: http
            containerPort: 8787
            protocol: TCP
          - name: voice
            containerPort: 8788
            protocol: TCP
          - name: edge
            containerPort: 8790
            protocol: TCP
        # Exec probes: the NetworkPolicy admits only Traefik and agentfest, as telly's.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["node", "-e", "fetch('http://127.0.0.1:8787/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 4
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["node", "-e", "fetch('http://127.0.0.1:8787/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
              periodSeconds: 20
              timeoutSeconds: 10
              failureThreshold: 3
          startup:
            enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # A CPU request of its own (0.5.13): without one its cgroup weight was 1 against
        # agentfest's ~39, so agent bursts starved the site (probes timed out at high steal).
        # 300m gives it weight ~12; the node's requests go from 3.03 to 3.33 of 6 CPUs.
        # No CPU limit: it may use more when there's room.
        resources:
          requests:
            cpu: 300m
            memory: 192Mi
          limits:
            memory: 768Mi
      voice:
        image:
          repository: ghcr.io/rounakdatta/towerofhan-voice
          tag: "0.5.9@sha256:a8dab777ab311b57a6a6c2e58f92d637173f90445ba482f859cfb148bdecdb77"
          pullPolicy: IfNotPresent
        # The standby lane: one thread (this VPS throttles sustained multi-core load
        # for every process on it). It takes nothing while any runner has been heard
        # from in the last PATIENCE seconds, and everything once they've gone quiet
        # (both workers down). Same image and model as the runners, so voices match.
        env:
          VOICE_URL: http://127.0.0.1:8788
          LANES: "1"
          THREADS: "1"
          PATIENCE: "15"
          NICE: "5"
          NODE_NAME:
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        # It listens on nothing; a stuck lane shows in /status (voicing.lanes).
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # One Kokoro session on the fp16 model: ~530 MB.
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi

  # Voice runners: the voicing, on the worker nodes (the control plane is a VPS that
  # throttles sustained load, and is short of memory). One per worker, each running
  # as many Kokoro lanes as it has cores (two threads a lane, at most four lanes).
  # Stateless: they claim a comment from towerd's voice port, voice it and send the
  # clips back; a node that drops off just lets its leases lapse (20 s), and its
  # comments resume elsewhere from their last clip. No volume, no keys, no internet.
  runner:
    forceRename: towerofhan-runner
    type: deployment
    # One runner, in Paris (26 Nov): voice-ahead keeps it busy for hours at a stretch, and
    # the Rishra home box (i5-7400) can't cool that. At four busy cores it reset abruptly;
    # at two it climbed to 87-89 °C. Paris is a VPS that idles 91-97% of the day.
    replicas: 1
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: homelab.setup/city
                    operator: NotIn
                    values: [rishra]
        # one per node: two on one node would only fight over its cores
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: towerofhan
                  app.kubernetes.io/controller: runner
      # The Rishra worker blinks NotReady now and then: stay through it (the lanes
      # reconnect on their own) rather than be evicted and left Terminating.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
      terminationGracePeriodSeconds: 10
    containers:
      main:
        image:
          repository: ghcr.io/rounakdatta/towerofhan-voice
          tag: "0.5.9@sha256:a8dab777ab311b57a6a6c2e58f92d637173f90445ba482f859cfb148bdecdb77"
          pullPolicy: IfNotPresent
        env:
          VOICE_URL: http://towerofhan.apps.svc.cluster.local:8788
          THREADS: "2"
          # Two lanes of two threads: all four of Paris's cores (~3x real time, against ~0.9-3 h
          # of new speech an hour). The runner no longer runs on the Rishra box (see above).
          MAX_LANES: "2"
          NODE_NAME:
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # No CPU request or limit: the lanes use whatever the node isn't using, and
        # give way at once to everything else on it (frigate, Home Assistant, the
        # phones), which all ask for CPU. Memory: ~530 MB a lane.
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 3Gi

persistence:
  data:
    forceRename: towerofhan-data
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    # Audio at ~26 kbps: a busy day of voicing (many hours of speech) is under a GB,
    # kept RETENTION_DAYS, plus JSON.
    size: 10Gi
    storageClass: local-path
    # towerd and the fallback lane only: the runners are on other nodes, and carry nothing
    advancedMounts:
      towerofhan:
        web:
          - path: /data
        voice:
          - path: /data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

service:
  web:
    forceRename: towerofhan
    controller: towerofhan
    primary: true
    type: ClusterIP
    ports:
      http:
        port: 8787
        protocol: TCP
        primary: true
      # runners only (the NetworkPolicy); the ingress routes to http alone
      voice:
        port: 8788
        protocol: TCP
      # the Cloudflare Tunnel's connector only (the NetworkPolicy)
      edge:
        port: 8790
        protocol: TCP
