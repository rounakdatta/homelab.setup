---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# LeZeppLean: the server behind the T-Rex 3 lyrics app (rounakdatta/le-zepp-lean).
#
# Bumping is two lines AND a re-render, as for zepp-life-mcp: `version` here and
# `image.tag` in values.yaml, then
#
#   kustomize build --enable-helm kubernetes/apps/lezepplean >/dev/null
#   git rm -r kubernetes/apps/lezepplean/charts/lezepplean-<old>/
#   git add kubernetes/apps/lezepplean/charts/lezepplean-<new>/
#   python3 .github/scripts/charts-lock.py --write
helmCharts:
  - name: lezepplean
    repo: oci://ghcr.io/rounakdatta/charts
    version: 0.2.1
    releaseName: lezepplean
    namespace: apps
    valuesFile: values.yaml

resources:
  - ingress.yaml
