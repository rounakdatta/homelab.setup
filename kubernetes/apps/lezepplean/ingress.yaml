---
# PUBLIC hostname, but NOT unauthenticated -- and deliberately NOT behind
# tinyauth, for the same reason as zepp-life-mcp: the caller is the Zepp phone
# app's side service relaying the watch, not a browser, and it cannot complete a
# login redirect.
#
# Authentication is inside the application: every endpoint but /livez requires
# `Authorization: Bearer <token>` (the `token` key of lezepplean-credentials,
# synced from Bitwarden lezepplean/token), except that installs from the Zepp
# store (no token: a store package can be read by anyone) may use the watch's
# own endpoints within a Shazam budget (LEZEPPLEAN_PUBLIC in values.yaml).
# /livez is for kubelet probes and returns only {"ok": true}. Floods and big
# bodies stop at Traefik first (middleware.yaml). Rotating the token: update the Bitwarden item, run
# the deploy, restart the Deployment, and rebuild the watch app with the new one
# (tools/install-watch.sh in le-zepp-lean).
#
# DNS: `A lezepplean <host>` in rounakdatta/oh-my-dns (zones/taptappers.club.txt),
# DNS-only like every other homelab host; without it the pod is healthy but
# unreachable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lezepplean
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: apps-lezepplean-ratelimit@kubernetescrd,apps-lezepplean-inflight@kubernetescrd,apps-lezepplean-body@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: lezepplean.taptappers.club
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lezepplean
            port:
              number: 8787
  tls:
  - hosts:
    - lezepplean.taptappers.club
    secretName: lezepplean-tls-secret
