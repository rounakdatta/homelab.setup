# Values for the rounakdatta/texas-fold-em chart.
# Chart source: oci://ghcr.io/rounakdatta/charts/texas-fold-em
#
# Texas-fold-em is a long-running Go broker that holds a fold.money refresh
# token and issues short-lived access tokens to in-cluster consumers via
# /token. Single-replica by design (single writer to state.json).
#
# Chart 0.4.0 replaced the Gemini-specific Tier-3 client with a generic
# OpenAI-compatible LLM client, defaulting to DeepSeek.
#
# Chart 0.5.0 paginated the review UI (drops the hard 200-row cap) and
# extended /admin/classify's handler budget to 60m so backlog catch-up
# finishes in one shot. Chart and image tags now move together — the
# chart default image is "0.5.0", so we don't override here.
#
# Chart 0.20.0 moved Tier 3 from DeepSeek to Claude Opus 5.5 through the
# in-cluster auth2api gateway (the same key auth2api itself uses), taught
# it to learn from review feedback, and added the re-suggest loop that
# keeps waiting cards current (off until the shadow evaluation says the
# new engine beats the old suggestions).

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi
  accessMode: ReadWriteOnce

# Use the texas-fold-em-credentials Secret synced from Bitwarden by ansible.
# Keys (synced by ansible/playbook.yml):
#   - broker-key   — bearer auth for /token consumers
#   - admin-key    — bearer auth for /init and /admin/*
#   - firefly-pat  — long-lived Firefly III PAT (integration)
#   - llm-api-key  — OpenAI-compatible LLM key (integration Tier-3 RAG;
#                    currently sourced from deepseek/api_key in Bitwarden)
secret:
  create: false
  existingSecret: texas-fold-em-credentials

# fold→firefly classification subsystem. Wired into the pod via extraEnv
# (chart 0.3.0 added support for valueFrom secret references). The
# integration code is gated by TEXAS_FOLDEM_INTEGRATION_ENABLED so a
# stock deploy without these env vars behaves exactly as the broker did
# before — they're only consulted when the flag is true.
extraEnv:
  - name: TEXAS_FOLDEM_INTEGRATION_ENABLED
    value: "true"
  - name: TEXAS_FOLDEM_FIREFLY_BASE
    value: "http://firefly.apps.svc.cluster.local:8080"
  - name: TEXAS_FOLDEM_FIREFLY_PAT
    valueFrom:
      secretKeyRef:
        name: texas-fold-em-credentials
        key: firefly-pat
  # Tier 3 runs on Claude Opus 5.5 through auth2api, in-cluster (no TLS,
  # no ingress, its own rate-limit bucket), with auth2api's own key from
  # the Bitwarden-synced auth2api-credentials Secret. It spends the Claude
  # subscription behind auth2api — the same one Claude Code sessions use —
  # so the re-suggest pace below is deliberately modest. (DeepSeek's key
  # stays in texas-fold-em-credentials as llm-api-key, unused.)
  - name: TEXAS_FOLDEM_LLM_API_KEY
    valueFrom:
      secretKeyRef:
        name: auth2api-credentials
        key: api-key
  - name: TEXAS_FOLDEM_LLM_BASE_URL
    value: "http://auth2api.apps.svc.cluster.local:8317/v1"
  - name: TEXAS_FOLDEM_LLM_MODEL
    value: "claude-opus-5-5"
  # auth2api cuts a buffered answer at 120s; one attempt stops short of it.
  - name: TEXAS_FOLDEM_LLM_TIMEOUT
    value: "110s"
  # No extended thinking: the answer's "reasoning" field comes first, and
  # the shadow evaluation (POST /api/engine/eval) decides whether "low"
  # is worth its latency.
  - name: TEXAS_FOLDEM_LLM_REASONING_EFFORT
    value: ""
  # Parallel model calls in a classify pass (and a re-suggest pass).
  - name: TEXAS_FOLDEM_CLASSIFY_CONCURRENCY
    value: "4"
  # Re-suggest waiting cards: siblings of a card you corrected, and cards
  # an older engine suggested (newest first), never one a person decided.
  # On since the shadow evaluation (27 Sep, 70 sent rows) showed the new
  # engine beating the stored suggestions on every field but budget:
  # 6 cards every 2 minutes works through the ~455-card backlog in ~2.5h.
  - name: TEXAS_FOLDEM_RESUGGEST_EVERY
    value: "2m"
  - name: TEXAS_FOLDEM_RESUGGEST_LIMIT
    value: "6"
  # Periodic sync enabled at 1h cadence. Each tick fills the gap
  # between firefly's most recent date and now (since_firefly mode),
  # then classifies anything still pending. Self-healing across
  # outages: a missed tick is just caught up on the next one.
  - name: TEXAS_FOLDEM_PERIODIC_SYNC_EVERY
    value: "1h"
  # Per-cycle hard cap on fold transactions fetched. 2000 covers
  # over a year of typical activity at observed densities (~150
  # txns/month), so a multi-day outage self-heals on one tick.
  - name: TEXAS_FOLDEM_PERIODIC_SYNC_LIMIT
    value: "2000"
  # Read-only kill-switch for the firefly write surface. Initial deploy
  # leaves it OFF so we can preview-only first; flip to "true" if we
  # ever need to halt all writes without redeploying.
  - name: TEXAS_FOLDEM_FIREFLY_READONLY
    value: "false"
  # UI auth: bypass at the texas-fold-em layer because the cluster
  # ingress (added separately) puts tinyauth ForwardAuth in front. For
  # local dev against a port-forward, set to "true" to require the
  # tfe-admin cookie set by /admin/ui/login.
  - name: TEXAS_FOLDEM_UI_COOKIE_AUTH
    value: "false"
  # Persistent on-disk state for the integration's SQLite. Lives on the
  # same /data PVC as the broker's state.json but in a separate file.
  - name: TEXAS_FOLDEM_STAGING_DB_PATH
    value: "/data/staging.db"
  # Public firefly URL — used only by the review UI to deep-link pushed
  # rows to their firefly transaction (0.8.2+). Distinct from FIREFLY_BASE
  # (the in-cluster API URL, which a browser can't reach).
  - name: TEXAS_FOLDEM_FIREFLY_PUBLIC_URL
    value: "https://firefly.taptappers.club"
