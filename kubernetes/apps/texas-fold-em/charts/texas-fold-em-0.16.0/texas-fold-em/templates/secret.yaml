{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "texas-fold-em.labels" . | nindent 4 }}
type: Opaque
stringData:
  broker-key: {{ required "secret.brokerKey is required when secret.create=true" .Values.secret.brokerKey | quote }}
  admin-key: {{ required "secret.adminKey is required when secret.create=true" .Values.secret.adminKey | quote }}
{{- end }}
