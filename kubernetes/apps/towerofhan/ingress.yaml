---
# PRIVATE for now: the tailnet door only, while it is tried on phones and laptops.
# Going public is this file's entrypoint (tailnet -> websecure) plus the DNS record
# (the Tailscale address -> the public one, proxied by Cloudflare) in oh-my-dns.
#
# DNS: `A towerofhan <kanmani's Tailscale address>` in rounakdatta/oh-my-dns
# (zones/taptappers.club.txt); without it the pod is healthy but unreachable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: towerofhan
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: tailnet
spec:
  ingressClassName: traefik
  rules:
  - host: towerofhan.taptappers.club
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: towerofhan
            port:
              number: 8787
  tls:
  - hosts:
    - towerofhan.taptappers.club
    secretName: towerofhan-tls-secret
