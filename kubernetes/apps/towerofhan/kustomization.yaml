---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# TowerOfHan (github.com/rounakdatta/tower-of-hn.io, private): Hacker News's front
# page as a tower you can walk into, its threads voiced at tables, verbatim.
#
# One pod, two containers sharing /data: `web` (towerd: follows the HN API, writes
# the cached JSON the client polls, serves the client, queues voicing) and `voice`
# (Kokoro on ONE CPU thread: this node's hypervisor throttles sustained multi-core
# load for the whole VM). They talk through files, hence one pod.
#
# No chart of its own, so app-template, as auth2api and warren. Bumping a release is
# two image tags in values.yaml (tag AND digest); bumping app-template is the
# re-render described in warren's kustomization.
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: towerofhan
    namespace: apps
    valuesFile: values.yaml

resources:
  - ingress.yaml
  - networkpolicy.yaml
