---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# First use of bjw-s app-template in this repo — the generic "any image"
# chart. Nothing about auth2api is special enough to deserve a chart of its
# own (contrast agentfest/itineris/synt, which template app-specific config),
# so the whole deployment is values.yaml against a chart we don't maintain.
#
# app-template is the installable wrapper around the bjw-s `common` library
# that bookstack, vikunja and webtrees already pull in as a subchart — so this
# is a library the cluster has been running for a while, just used directly.
helmCharts:
  - name: app-template
    # OCI, not the old GitHub Pages repo. bjw-s retired
    # https://bjw-s-labs.github.io/helm-charts on 2026-09-16 -- it now answers
    # 404 for index.yaml, which broke EVERY deploy from this repo, not just
    # auth2api, because kustomize fails the whole accumulation on one bad chart.
    # Same chart, same version, same digest; only the transport changed.
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.1.0
    releaseName: auth2api
    namespace: apps
    valuesFile: values.yaml

# The chart renders the Deployment, Service and PVC. The Ingress is ours, as
# everywhere else in this repo -- it carries cert-manager and Traefik
# annotations the chart's own ingress block does not model, and it deliberately
# routes only the API prefixes (see ingress.yaml).
resources:
  - middleware.yaml
  - ingress.yaml
  - ingress-admin.yaml
