---
image:
  repository: ghcr.io/rounakdatta/zepp-life-mcp
  tag: "0.1.0"

zepp:
  mode: cloud_session
  timezone: Asia/Kolkata
  # Saves a discovery request, and lets the read-only server identify whose
  # archive it holds even when the apptoken has lapsed. Not a secret: it is an
  # account number, useless without the token.
  userId: "3308073311"
  existingSecret: zepp-life-mcp
  secretKeys:
    apptoken: apptoken
    bearerToken: bearerToken

server:
  # The CronJob is the only writer. This also stops an MCP client mutating the
  # archive through the public endpoint.
  readOnly: true

sync:
  enabled: true
  # 03:17 IST. The band uploads on the phone's schedule; syncing more often than
  # it does buys nothing.
  schedule: "17 3 * * *"
  # Every type, which includes workout_details (GPS tracks and per-second heart
  # rate). That first run fetches ~800 MB from Zepp and stores ~120 MB; every
  # run after it skips what is already archived and fetches only new workouts.
  dataTypes: []
  startDate: "2020-01-01"

persistence:
  enabled: true
  storageClass: local-path
  # The archive is ~700 KB today and grows by roughly 120 MB once workout tracks
  # are backfilled. 10Gi is generous, but the control-plane disk has been tight
  # before -- check headroom before raising it.
  size: 10Gi

# local-path is node-local: a claim binds to whichever node first consumes it
# and stays there for good. itineris learned this the hard way when its claim
# bound to the rishra worker `jomjom` and that node went unreachable mid-rollout.
# Both the server and the sync job must land on the control-plane node.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
