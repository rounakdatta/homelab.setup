---
image:
  repository: ghcr.io/rounakdatta/zepp-life-mcp
  tag: "0.3.3"

zepp:
  mode: cloud_session
  timezone: Asia/Kolkata
  # Saves a discovery request, and lets the read-only server identify whose
  # archive it holds even when the apptoken has lapsed. Not a secret: it is an
  # account number, useless without the token.
  userId: "3308073311"
  existingSecret: zepp-life-mcp
  secretKeys:
    apptoken: apptoken
    bearerToken: bearerToken

server:
  # The CronJob is the only writer. This also stops an MCP client mutating the
  # archive through the public endpoint.
  readOnly: true

  # No CPU request, deliberately.
  #
  # The control-plane node is at 99% of CPU *requests* (3985m of 4000m) while
  # actually using 42% (1705m). The scheduler, not the hardware, is what is
  # full: requests across this cluster are provisioned far above real usage, so
  # even a 25m request made this pod unschedulable with 2.3 cores genuinely idle.
  #
  # Dropping the request is the fix that touches only this app. Rebalancing the
  # other workloads' requests is the real fix and belongs in its own change.
  # This pod is idle between MCP calls, so it loses nothing by having no
  # reservation -- under contention it simply yields.
  resources:
    requests:
      cpu: null
      memory: 128Mi

sync:
  enabled: true
  # 03:17 IST. The band uploads on the phone's schedule; syncing more often than
  # it does buys nothing.
  schedule: "17 3 * * *"
  # Kubernetes reads the schedule in UTC unless this is set, so without it the
  # "03:17 IST" above actually meant 03:17 UTC -- 08:47 IST. That, plus the
  # CronJob being created after 03:17 UTC, is why it had never fired.
  timeZone: "Asia/Kolkata"
  # Every type, which includes workout_details (GPS tracks and per-second heart
  # rate). That first run fetches ~800 MB from Zepp and stores ~120 MB; every
  # run after it skips what is already archived and fetches only new workouts.
  dataTypes: []
  # Empty on purpose: the service resumes from its stored cursor, and falls back
  # to 2020-01-01 when a cloud source has none yet. Naming a date here would
  # override the cursor and re-fetch the whole history every night.
  startDate: ""
  # Same reasoning as the server: a 50m request would not fit either, and this
  # runs once a night.
  resources:
    requests:
      cpu: null
      memory: 256Mi
    limits:
      memory: 1Gi

persistence:
  enabled: true
  storageClass: local-path
  # The archive is ~700 KB today and grows by roughly 120 MB once workout tracks
  # are backfilled. 10Gi is generous, but the control-plane disk has been tight
  # before -- check headroom before raising it.
  size: 10Gi

# local-path is node-local: a claim binds to whichever node first consumes it
# and stays there for good. itineris learned this the hard way when its claim
# bound to the rishra worker `jomjom` and that node went unreachable mid-rollout.
# Both the server and the sync job must land on the control-plane node.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
