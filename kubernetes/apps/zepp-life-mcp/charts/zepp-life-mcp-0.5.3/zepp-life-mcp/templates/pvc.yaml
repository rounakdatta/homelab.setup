{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "zepp-life-mcp.claimName" . }}
  labels:
    {{- include "zepp-life-mcp.labels" . | nindent 4 }}
  annotations:
    # The archive is the point of this deployment and a re-fetch cannot recover
    # history Zepp no longer serves, so the volume outlives `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
