apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zepp-life-mcp.fullname" . }}
  labels:
    {{- include "zepp-life-mcp.labels" . | nindent 4 }}
spec:
  # The archive is a ReadWriteOnce local-path volume, so this cannot scale past
  # one pod on one node regardless of what replicaCount says.
  replicas: {{ .Values.server.replicaCount }}
  strategy:
    # Recreate, not RollingUpdate: a second pod cannot attach the same RWO
    # volume, so a rolling update would deadlock waiting for a mount.
    type: Recreate
  selector:
    matchLabels:
      {{- include "zepp-life-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zepp-life-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - serve
            - --transport=http
            - --host=0.0.0.0
            - --port={{ .Values.server.port }}
            {{- if .Values.server.readOnly }}
            - --read-only
            {{- end }}
          env:
            {{- include "zepp-life-mcp.commonEnv" . | nindent 12 }}
            # A file, not an env var: /metrics asks Zepp with it, and a mounted
            # Secret updates in place when the apptoken is renewed. An env var
            # would keep the expired one until the pod restarted.
            - name: ZEPP_APP_TOKEN_FILE
              value: /run/zepp/apptoken
            # Read from the environment rather than a flag: an argv secret shows
            # up in `ps` and in the pod spec.
            - name: ZEPP_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zepp.existingSecret }}
                  key: {{ .Values.zepp.secretKeys.bearerToken }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          # /healthz is outside the bearer check precisely so these work.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            # readOnlyRootFilesystem is on, and Python still wants somewhere to
            # write.
            - name: tmp
              mountPath: /tmp
            - name: apptoken
              mountPath: /run/zepp
              readOnly: true
      volumes:
        - name: apptoken
          secret:
            secretName: {{ .Values.zepp.existingSecret }}
            # Group-readable: the pod runs as 10001 with fsGroup 10001, and the
            # Secret files are root-owned with group fsGroup.
            defaultMode: 0440
            items:
              - key: {{ .Values.zepp.secretKeys.apptoken }}
                path: apptoken
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "zepp-life-mcp.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
