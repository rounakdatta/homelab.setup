---
# PUBLIC, like audiobookshelf and itineris: the websecure entrypoint and no
# tinyauth. The app's own password gates everything but robots.txt and the
# trust profile.
#
# letsencrypt-prod like every other host. The iPad this serves (iOS 9) does not
# trust the ISRG roots out of the box, so the app hands it a profile that adds
# them; see kustomization.yaml.
#
# DNS: `A books 173.234.14.113` in oh-my-dns zones/taptappers.club.txt.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookshelf
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nightwatch/name: Bookshelf
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
  - host: books.taptappers.club
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bookshelf
            port:
              number: 80
  tls:
  - hosts:
    - books.taptappers.club
    secretName: bookshelf-tls-secret
