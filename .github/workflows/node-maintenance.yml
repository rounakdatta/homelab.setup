name: Node maintenance (control plane)

# Explicit, auditable housekeeping on the control-plane node over Tailscale
# SSH. Nothing runs unless its input is switched on. Each action is one that
# a node under disk pressure needs and that cannot lose data:
#   prune_images   removes container images no running/stopped container uses
#                  (they are pulled again on demand)
#   vacuum_journal trims the systemd journal to 300 MB
# Reports disk usage before and after.

on:
  workflow_dispatch:
    inputs:
      prune_images:
        description: 'Remove container images not used by any container (k3s crictl rmi --prune)'
        type: boolean
        default: false
      vacuum_journal:
        description: 'Trim the systemd journal to 300M'
        type: boolean
        default: false
      rollout_restart:
        description: 'Restart one deployment (namespace/name, e.g. apps/itineris) so it picks up a changed Secret or ConfigMap'
        type: string
        default: ''
      tune_leader_election:
        description: 'k3s on slow storage: let controllers survive slow etcd (lease 60s / renew 45s / retry 10s) via a config.yaml.d drop-in, then restart k3s once'
        type: boolean
        default: false
      enable_secrets_encryption:
        description: 'Encrypt Secrets at rest in etcd: write the config.yaml.d drop-in, restart k3s once, reencrypt existing Secrets. Idempotent — a no-op once enabled.'
        type: boolean
        default: false
      velero_status:
        description: 'Read-only Velero report: server + node-agent, repository password strength (never printed), BSLs, backup repositories, last backups'
        type: boolean
        default: false
      backup_restore_drill:
        description: 'Prove backups restore: back up a throwaway canary pod, delete it, restore it from R2, compare a random token. Touches nothing else.'
        type: boolean
        default: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      CONTROL: ${{ secrets.CONTROL_MACHINE_NAME }}
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.76.1
          args: --advertise-tags=tag:homelab

      - name: Before
        run: |
          tailscale ssh "root@${CONTROL}" 'df -h / | tail -1; echo "images: $(k3s crictl images -q 2>/dev/null | wc -l)"; k3s crictl imagefsinfo 2>/dev/null | tr -d " \n" | cut -c1-240; echo'

      - name: Prune unused container images
        if: ${{ inputs.prune_images }}
        run: |
          tailscale ssh "root@${CONTROL}" 'k3s crictl rmi --prune 2>&1 | tail -n 3; echo "images left: $(k3s crictl images -q 2>/dev/null | wc -l)"'

      - name: Vacuum the systemd journal
        if: ${{ inputs.vacuum_journal }}
        run: |
          tailscale ssh "root@${CONTROL}" 'journalctl --vacuum-size=300M 2>&1 | tail -n 2'

      # The controllers embedded in k3s renew a 15 s lease every 10 s; when etcd
      # takes seconds per request they lose it and k3s exits ("leaderelection
      # lost"), and the restart makes the disk even busier. Longer leases are
      # the documented mitigation for k3s on slow disks. Written as a drop-in
      # (config.yaml.d, k3s >= 1.24) only when config.yaml does not already set
      # these keys, so nothing of the existing configuration is replaced;
      # `rm /etc/rancher/k3s/config.yaml.d/10-leader-election.yaml` reverts it.
      - name: Tune leader election for slow storage
        if: ${{ inputs.tune_leader_election }}
        run: |
          tailscale ssh "root@${CONTROL}" 'bash -s' <<'EOS'
            set -e
            v="$(k3s --version | head -1)"; echo "$v"
            minor="$(echo "$v" | sed -E 's/.*v1\.([0-9]+)\..*/\1/')"
            if [ -z "$minor" ] || [ "$minor" -lt 24 ]; then echo "k3s too old for config.yaml.d; not touching it"; exit 0; fi
            if [ -f /etc/rancher/k3s/config.yaml ] && grep -qE '^(kube-controller-manager-arg|kube-scheduler-arg|kube-cloud-controller-manager-arg)' /etc/rancher/k3s/config.yaml; then
              echo "config.yaml already sets controller/scheduler args -- merge by hand instead"; exit 0
            fi
            mkdir -p /etc/rancher/k3s/config.yaml.d
            cat > /etc/rancher/k3s/config.yaml.d/10-leader-election.yaml <<'YAML'
          # Added 2026-09-06: etcd on this disk fsyncs in ~100 ms; with the default
          # 15 s lease / 10 s renew deadline the controllers lost leadership and k3s
          # exited every few minutes. Delete this file to revert.
          kube-controller-manager-arg:
            - leader-elect-lease-duration=60s
            - leader-elect-renew-deadline=45s
            - leader-elect-retry-period=10s
          kube-scheduler-arg:
            - leader-elect-lease-duration=60s
            - leader-elect-renew-deadline=45s
            - leader-elect-retry-period=10s
          kube-cloud-controller-manager-arg:
            - leader-elect-lease-duration=60s
            - leader-elect-renew-deadline=45s
            - leader-elect-retry-period=10s
          YAML
            echo "drop-in written; restarting k3s once"
            before="$(systemctl show k3s -p NRestarts --value)"
            systemctl restart k3s
            sleep 25
            systemctl is-active k3s
            echo "restart counter: $before -> $(systemctl show k3s -p NRestarts --value) (a manual restart does not count)"
            journalctl -u k3s --since '-2 min' --no-pager | grep -m1 -oE 'Running kube-controller-manager .*leader-elect-lease-duration=[0-9a-z]+' | sed -E 's/--(client-ca-file|authentication-kubeconfig|authorization-kubeconfig|kubeconfig|service-account-private-key-file|root-ca-file|cluster-signing[a-z-]*)=[^ ]+ ?//g' | cut -c1-300
          EOS

      # Encrypt Secrets at rest in etcd on the RUNNING cluster. Fresh installs
      # get this from --secrets-encryption in the k3s role; this is the one-time
      # enablement for the cluster that was installed without it. Guarded and
      # idempotent: a no-op once encryption reports Enabled; only writes the
      # drop-in when config.yaml does not already set the key; restarts k3s ONCE,
      # waits for the API, then reencrypts the existing Secrets. Secrets stay
      # readable the whole time (k3s keeps an identity reader beside the aescbc
      # writer) and are also rewritten from Bitwarden on the next deploy, so this
      # cannot lock anything out. Revert:
      #   rm /etc/rancher/k3s/config.yaml.d/20-secrets-encryption.yaml && systemctl restart k3s
      - name: Enable Secrets encryption at rest
        if: ${{ inputs.enable_secrets_encryption }}
        run: |
          tailscale ssh "root@${CONTROL}" 'bash -s' <<'EOS'
            set -e
            echo "== current status =="
            k3s secrets-encrypt status 2>/dev/null || echo "(secrets-encrypt status unavailable -- not yet enabled)"
            if k3s secrets-encrypt status 2>/dev/null | grep -qiE 'Encryption Status:[[:space:]]*Enabled'; then
              # Already on (no restart needed). Still run reencrypt so EVERY
              # existing Secret is rewritten encrypted -- not just the
              # Bitwarden-synced ones a deploy rewrites, but cert-manager TLS
              # secrets, service-account tokens, etc. Idempotent and non-fatal.
              echo "already enabled; reencrypting all existing Secrets to be sure"
              k3s secrets-encrypt reencrypt --force 2>&1 || echo "reencrypt returned nonzero -- remaining Secrets encrypt on next write"
              for i in $(seq 1 24); do k3s kubectl get nodes >/dev/null 2>&1 && break; sleep 5; done
              k3s secrets-encrypt status || true
              exit 0
            fi
            v="$(k3s --version | head -1)"; echo "$v"
            minor="$(echo "$v" | sed -E 's/.*v1\.([0-9]+)\..*/\1/')"
            if [ -z "$minor" ] || [ "$minor" -lt 24 ]; then echo "k3s too old for config.yaml.d; aborting"; exit 1; fi
            if [ -f /etc/rancher/k3s/config.yaml ] && grep -qE '^secrets-encryption' /etc/rancher/k3s/config.yaml; then
              echo "config.yaml already sets secrets-encryption -- merge by hand instead"; exit 1
            fi
            # Do not restart an already-unhealthy k3s.
            systemctl is-active k3s
            mkdir -p /etc/rancher/k3s/config.yaml.d
            {
              echo "# Added 2026-09-28: encrypt Secrets at rest in etcd (aescbc). k3s manages"
              echo "# the key at /var/lib/rancher/k3s/server/cred/encryption-config.json."
              echo "# Delete this file and restart k3s to revert (Secrets stay readable)."
              echo "secrets-encryption: true"
            } > /etc/rancher/k3s/config.yaml.d/20-secrets-encryption.yaml
            echo "drop-in written; restarting k3s once"
            before="$(systemctl show k3s -p NRestarts --value)"
            systemctl restart k3s
            for i in $(seq 1 36); do
              if k3s kubectl get nodes >/dev/null 2>&1; then echo "API back after ~$((i*5))s"; break; fi
              sleep 5
            done
            systemctl is-active k3s
            echo "restart counter: $before -> $(systemctl show k3s -p NRestarts --value) (a manual restart does not count)"
            echo "== status after enable =="
            k3s secrets-encrypt status
            echo "== reencrypt existing Secrets (non-fatal; next deploy also rewrites them) =="
            k3s secrets-encrypt reencrypt --force 2>&1 || echo "reencrypt returned nonzero -- existing Secrets will encrypt on next write/deploy"
            for i in $(seq 1 24); do
              if k3s kubectl get nodes >/dev/null 2>&1; then break; fi
              sleep 5
            done
            echo "== final status =="
            k3s secrets-encrypt status || true
          EOS

      - name: Rollout restart
        if: ${{ inputs.rollout_restart != '' }}
        env:
          TARGET: ${{ inputs.rollout_restart }}
        run: |
          case "$TARGET" in
            [a-z0-9-]*/[a-z0-9-]*) ;;
            *) echo "::error::rollout_restart must be namespace/name"; exit 1;;
          esac
          ns="${TARGET%%/*}"; name="${TARGET#*/}"
          tailscale ssh "root@${CONTROL}" "k3s kubectl -n '$ns' rollout restart deployment/'$name' && k3s kubectl -n '$ns' rollout status deployment/'$name' --timeout=240s"

      # Read-only: everything an "are the backups healthy?" question needs. The
      # repository password is reported only as its length and whether it is
      # Velero's public default -- the value itself never leaves the node.
      # Runs after Rollout restart, so one dispatch can restart velero and then
      # report on it.
      - name: Velero status
        if: ${{ inputs.velero_status }}
        run: |
          tailscale ssh "root@${CONTROL}" 'bash -s' <<'EOS'
            K="k3s kubectl -n velero"
            echo "== velero server / node-agent =="
            $K get deploy velero --no-headers -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,WANT:.spec.replicas
            $K get ds node-agent --no-headers -o custom-columns=NAME:.metadata.name,READY:.status.numberReady,WANT:.status.desiredNumberScheduled
            echo "== repository password (length only; never printed) =="
            p="$($K get secret velero-repo-credentials -o jsonpath='{.data.repository-password}' 2>/dev/null | base64 -d 2>/dev/null)"
            if [ -z "$p" ]; then echo "MISSING"
            elif [ "$p" = "static-passw0rd" ]; then echo "DEFAULT (static-passw0rd) -- the public default, NOT safe"
            else echo "custom (${#p} chars)"; fi
            unset p
            echo "== backup storage locations =="
            $K get bsl -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,DEFAULT:.spec.default,PREFIX:.spec.objectStorage.prefix,VALIDATED:.status.lastValidationTime
            echo "== backup repositories =="
            $K get backuprepositories -o custom-columns=NAMESPACE:.spec.volumeNamespace,TYPE:.spec.repositoryType,PHASE:.status.phase,MESSAGE:.status.message
            # A BSL change (bucket/prefix/config) makes Velero mark every
            # repository NotReady and re-establish it at the new location, so a
            # recent status time here is how you tell "re-established" from
            # "stale Ready".
            echo "-- when each repository was last written (manager: time) --"
            $K get backuprepositories -o jsonpath='{range .items[*]}{.spec.volumeNamespace}{":"}{range .metadata.managedFields[*]}{"  "}{.manager}{"@"}{.time}{end}{"\n"}{end}'
            echo "== last 6 backups (oldest first) =="
            $K get backups --sort-by=.metadata.creationTimestamp --no-headers -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,ERRORS:.status.errors,WARNINGS:.status.warnings,STARTED:.status.startTimestamp | tail -n 6
          EOS

      # Proves the backups can actually be RESTORED -- the only test of a backup
      # that counts. A throwaway pod writes a random token to an emptyDir (no
      # PVC, so nothing is left behind); it is backed up, its namespace is
      # deleted, and it is restored from R2 through the same BSL and Kopia
      # repository password as every real backup; then the token is compared.
      # Touches nothing but the velero-drill namespace, and the drill backup
      # expires itself after an hour.
      - name: Backup/restore drill
        if: ${{ inputs.backup_restore_drill }}
        run: |
          tailscale ssh "root@${CONTROL}" 'bash -s' <<'EOS'
            set -eu
            K="k3s kubectl"
            NS=velero-drill
            STAMP="$(date -u +%Y%m%d%H%M%S)"
            B="drill-$STAMP"; R="drill-$STAMP-restore"
            TOKEN="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            cleanup() {
              $K delete ns "$NS" --ignore-not-found --wait=false >/dev/null 2>&1 || true
              $K -n velero delete restore "$R" --ignore-not-found >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            final_phase() {
              for _ in $(seq 1 90); do
                ph="$($K -n velero get "$1" "$2" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                case "$ph" in Completed|PartiallyFailed|Failed|FailedValidation) echo "$ph"; return 0;; esac
                sleep 10
              done
              echo "TIMEOUT(${ph:-none})"
            }
            echo "== 1. canary pod: a random token on an emptyDir =="
            $K delete ns "$NS" --ignore-not-found --wait=true --timeout=180s
            $K create ns "$NS"
            echo '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"canary","namespace":"velero-drill"},"spec":{"nodeSelector":{"node-role.kubernetes.io/control-plane":"true"},"terminationGracePeriodSeconds":1,"containers":[{"name":"c","image":"busybox:1.36","command":["sh","-c","sleep 3600"],"volumeMounts":[{"name":"data","mountPath":"/data"}]}],"volumes":[{"name":"data","emptyDir":{}}]}}' | $K apply -f -
            $K -n "$NS" wait --for=condition=Ready pod/canary --timeout=180s
            $K -n "$NS" exec canary -- sh -c "echo $TOKEN > /data/canary.txt"
            echo "== 2. back it up: $B =="
            printf '{"apiVersion":"velero.io/v1","kind":"Backup","metadata":{"name":"%s","namespace":"velero"},"spec":{"includedNamespaces":["%s"],"defaultVolumesToFsBackup":true,"storageLocation":"default","ttl":"1h0m0s"}}' "$B" "$NS" | $K create -f -
            bp="$(final_phase backup "$B")"; echo "backup: $bp"
            $K -n velero get podvolumebackups -l velero.io/backup-name="$B" -o custom-columns=VOLUME:.spec.volume,PHASE:.status.phase,BYTES:.status.progress.totalBytes,MESSAGE:.status.message
            if [ "$bp" != "Completed" ]; then $K -n velero get backup "$B" -o jsonpath='{.status.failureReason}{"\n"}' || true; echo "DRILL FAILED at backup"; exit 1; fi
            echo "== 3. delete the namespace =="
            $K delete ns "$NS" --wait=true --timeout=180s
            echo "== 4. restore it from R2: $R =="
            printf '{"apiVersion":"velero.io/v1","kind":"Restore","metadata":{"name":"%s","namespace":"velero"},"spec":{"backupName":"%s"}}' "$R" "$B" | $K create -f -
            rp="$(final_phase restore "$R")"; echo "restore: $rp"
            $K -n velero get restore "$R" --no-headers -o custom-columns=PHASE:.status.phase,ERRORS:.status.errors,WARNINGS:.status.warnings
            $K -n velero get podvolumerestores -l velero.io/restore-name="$R" -o custom-columns=VOLUME:.spec.volume,PHASE:.status.phase,BYTES:.status.progress.totalBytes,MESSAGE:.status.message
            case "$rp" in Completed|PartiallyFailed) ;; *) $K -n velero get restore "$R" -o jsonpath='{.status.failureReason}{"\n"}' || true; echo "DRILL FAILED at restore"; exit 1;; esac
            $K -n "$NS" wait --for=condition=Ready pod/canary --timeout=300s
            got="$($K -n "$NS" exec canary -- cat /data/canary.txt | tr -d '\r\n')"
            echo "== 5. verdict =="
            if [ "$got" = "$TOKEN" ]; then echo "DRILL PASSED: the restored token matches the one written before the backup"
            else echo "DRILL FAILED: the restored token does not match"; exit 1; fi
            echo "== backup repositories now =="
            $K -n velero get backuprepositories -o custom-columns=NAMESPACE:.spec.volumeNamespace,PHASE:.status.phase,MESSAGE:.status.message
          EOS

      - name: After
        run: |
          tailscale ssh "root@${CONTROL}" 'df -h / | tail -1; echo "k3s restarts so far: $(systemctl show k3s -p NRestarts --value)"'
