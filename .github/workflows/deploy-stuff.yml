name: Deploy stuff to the infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes/**'
      - 'ansible/**'
      - '.github/workflows/deploy-stuff.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.76.1
          args: --advertise-tags=tag:homelab

      - name: Fetch kubeconfig via Tailscale SSH
        run: |
          # Tailscale SSH - no keys needed!
          mkdir -p ~/.kube
          tailscale ssh root@${{ secrets.CONTROL_MACHINE_NAME }} "cat /etc/rancher/k3s/k3s.yaml" > ~/.kube/config
          sed -i "s|https://127.0.0.1:6443|https://${{ secrets.CONTROL_MACHINE_NAME }}:6443|g" ~/.kube/config
          kubectl cluster-info

      - name: Install Bitwarden CLI
        run: npm install -g @bitwarden/cli

      - name: Sync secrets from Bitwarden
        env:
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
        run: |
          pip install ansible
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook ansible/playbook.yml --tags secrets -i localhost,

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.1

      - name: Install Kustomize
        # Standalone kustomize is needed (instead of kubectl-bundled) because
        # the bundled version doesn't support OCI Helm registries (e.g. the
        # vikunja chart at oci://ghcr.io/go-vikunja/helm-chart).
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Deploy manifests
        run: |
          # Render once (helm fetches the chart over network)
          kustomize build --enable-helm kubernetes/ > /tmp/manifest.yaml

          # Pre-apply selector migration: spec.selector is immutable, so any
          # workload whose selectorLabels change between deploys (typical when
          # switching from hand-rolled to chart-rendered) needs the old object
          # deleted first. Script is idempotent — no-op once selectors match.
          pip install --quiet pyyaml
          python3 .github/scripts/migrate-selectors.py /tmp/manifest.yaml

          # One-time cutover: tinyauth replaces authelia at auth.taptappers.club.
          # `kubectl apply` doesn't prune, so the old authelia Ingress would
          # otherwise still claim the host alongside tinyauth's new one,
          # leaving Traefik routing undefined. Delete is idempotent
          # (--ignore-not-found) so subsequent deploys are no-ops.
          kubectl -n authelia delete ingress authelia --ignore-not-found

          # One-time cleanup: a previous deploy of the otwld/velero-ui chart
          # rendered velero-ui Deployment+Service without `metadata.namespace`
          # (chart relies on `helm install --namespace`, which kustomize's
          # helmCharts.namespace doesn't propagate to metadata). They landed
          # in `default` ns. The kustomization now sets `namespace: velero`
          # at root which fixes new renders; this cleans up the strays.
          # Idempotent: --ignore-not-found.
          kubectl -n default delete deploy velero-ui --ignore-not-found
          kubectl -n default delete svc velero-ui --ignore-not-found

          # First apply may fail for Velero/cert-manager CRs if CRDs haven't propagated yet
          kubectl apply -f /tmp/manifest.yaml || true
          # Wait for any CRDs to be established
          kubectl wait --for=condition=Established crd --all --timeout=30s 2>/dev/null || true
          # Second apply catches resources that depend on CRDs
          kubectl apply -f /tmp/manifest.yaml
          echo ""
          echo "=== Deployment Status ==="
          kubectl get pods -A | grep -v kube-system
