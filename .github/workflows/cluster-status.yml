name: Cluster status (read-only)

# Diagnostics on demand: nodes and their conditions, every pod that is not
# Running with the events behind it, PV node affinity, recent events, usage.
# Every command is a get, describe or top -- this workflow never mutates
# anything. It exists because the deploy log's pod listing is otherwise the
# only view of the cluster from outside the tailnet.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Namespace whose non-running pods get described'
        required: false
        default: 'apps'
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.76.1
          args: --advertise-tags=tag:homelab

      # Node-level view of the control plane, over Tailscale SSH, BEFORE any
      # kubectl call: when the API server itself is flapping this is the only
      # step that can still say why (memory, disk, k3s restarts, OOM kills).
      # Read-only: status, journal and dmesg reads, nothing is changed.
      - name: Control-plane node doctor
        env:
          CONTROL: ${{ secrets.CONTROL_MACHINE_NAME }}
        run: |
          tailscale ssh "root@${CONTROL}" 'bash -s' <<'EOS' || echo "(node doctor could not complete)"
            set +e
            echo "== uptime / load ==";        uptime
            echo "== memory (MB) ==";          free -m
            echo "== disk ==";                 df -h / /var/lib/rancher 2>/dev/null | sed 1q; df -h / /var/lib/rancher 2>/dev/null | tail -n +2 | sort -u
            echo "== k3s service ==";          systemctl is-active k3s; systemctl show k3s -p NRestarts -p ActiveEnterTimestamp -p ExecMainStartTimestamp
            echo "== api port ==";             (ss -ltn 2>/dev/null || netstat -ltn) | grep -c ':6443 ' | sed 's/^/listeners on 6443: /'
            echo "== k3s journal: errors in the last 2h (tail) =="
            journalctl -u k3s --since '-2 hours' --no-pager 2>/dev/null | grep -iE 'panic|fatal|oom|out of memory|failed to|timed out|leader|etcd|sqlite|database|certificate' | tail -40
            echo "== pressure stall (PSI: % of time tasks waited) =="
            for r in cpu io memory; do printf '%s: ' "$r"; cat /proc/pressure/$r 2>/dev/null | head -1; done
            echo "== etcd disk latency (avg ms over the process lifetime) =="
            curl -s --max-time 5 http://127.0.0.1:2381/metrics 2>/dev/null | awk '/^etcd_disk_wal_fsync_duration_seconds_(sum|count)/ {f[$1]=$2} /^etcd_disk_backend_commit_duration_seconds_(sum|count)/ {c[$1]=$2} END { if (f["etcd_disk_wal_fsync_duration_seconds_count"]>0) printf "wal fsync avg %.1f ms over %d\n", 1000*f["etcd_disk_wal_fsync_duration_seconds_sum"]/f["etcd_disk_wal_fsync_duration_seconds_count"], f["etcd_disk_wal_fsync_duration_seconds_count"]; if (c["etcd_disk_backend_commit_duration_seconds_count"]>0) printf "backend commit avg %.1f ms over %d\n", 1000*c["etcd_disk_backend_commit_duration_seconds_sum"]/c["etcd_disk_backend_commit_duration_seconds_count"], c["etcd_disk_backend_commit_duration_seconds_count"] }'
            echo "== disk: rotational flag, and who is doing I/O (5 s sample) =="
            cat /sys/block/vda/queue/rotational 2>/dev/null | sed 's/^/vda rotational: /'
            if command -v iotop >/dev/null; then iotop -b -o -n 2 -d 5 2>/dev/null | grep -vE '^Total|^Actual|^Current' | head -14; elif command -v pidstat >/dev/null; then pidstat -d 5 1 2>/dev/null | sort -k6 -n -r | head -12; else
              # no iotop/pidstat: sample /proc/<pid>/io write_bytes over 5 s for the busiest processes
              for p in /proc/[0-9]*; do r1=$(awk '/^read_bytes/{print $2}' $p/io 2>/dev/null); w1=$(awk '/^write_bytes/{print $2}' $p/io 2>/dev/null); [ -n "$w1" ] && echo "$(basename $p) $r1 $w1"; done > /tmp/io1; sleep 5
              for p in /proc/[0-9]*; do r2=$(awk '/^read_bytes/{print $2}' $p/io 2>/dev/null); w2=$(awk '/^write_bytes/{print $2}' $p/io 2>/dev/null); [ -n "$w2" ] && echo "$(basename $p) $r2 $w2"; done > /tmp/io2
              join /tmp/io1 /tmp/io2 | awk '{ d=($4-$2)+($5-$3); if (d>0) printf "%d %s\n", d/1048576, $1 }' | sort -n -r | head -10 | while read mb pid; do echo "${mb} MB/5s  pid ${pid}  $(tr '\0' ' ' < /proc/${pid}/cmdline 2>/dev/null | cut -c1-90)"; done
              rm -f /tmp/io1 /tmp/io2
            fi
            echo "== velero: backups in progress? (may fail if the API is down) =="
            timeout 20 k3s kubectl -n velero get backups --sort-by=.status.startTimestamp -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,START:.status.startTimestamp' 2>/dev/null | tail -4
            echo "== why k3s exited (last restarts, with the lines just before) =="
            journalctl -u k3s --since '-3 hours' --no-pager 2>/dev/null | grep -B4 -E 'k3s.service: (Main process exited|Failed with result|Scheduled restart)' | grep -vE 'request stats|took too long' | tail -30
            echo "== kernel OOM / task kills (tail) =="
            dmesg -T 2>/dev/null | grep -iE 'oom|out of memory|killed process' | tail -12
            echo "== top processes by memory =="
            top -bn1 -o %MEM 2>/dev/null | sed -n '7,18p'
            echo "== top processes by cpu =="
            top -bn1 -o %CPU 2>/dev/null | sed -n '7,14p'
            echo "== cpus ==";                 nproc
            echo "== where the disk went (GB, depth 1; capped at 2 min each) =="
            timeout 120 du -xBG -d1 /var/lib/rancher/k3s 2>/dev/null | sort -n | tail -6
            timeout 120 du -xBG -d1 /var/lib/rancher/k3s/storage 2>/dev/null | sort -n | tail -10
            timeout 120 du -xBG -d1 /var/lib/rancher/k3s/agent 2>/dev/null | sort -n | tail -4
            timeout 60 du -xsBG /var/log /var/lib/containerd /home /root /tmp /var/tmp /var/cache 2>/dev/null | sort -n
            echo "== container images ==";     k3s crictl imagefsinfo 2>/dev/null | tr -d ' \n' | cut -c1-300; echo; k3s crictl images 2>/dev/null | wc -l | sed 's/^/images: /'
            echo "== containers (name, state) =="
            k3s crictl ps -a 2>/dev/null | awk 'NR>1 {print $(NF-2), $(NF-1), $NF}' | sort | head -60
          EOS

      - name: Fetch kubeconfig via Tailscale SSH
        env:
          CONTROL: ${{ secrets.CONTROL_MACHINE_NAME }}
        run: |
          mkdir -p ~/.kube
          tailscale ssh "root@${CONTROL}" "cat /etc/rancher/k3s/k3s.yaml" > ~/.kube/config
          sed -i "s|https://127.0.0.1:6443|https://${CONTROL}:6443|g" ~/.kube/config
          kubectl cluster-info | head -1 || echo "(API server not answering)"

      - name: Nodes
        continue-on-error: true
        run: |
          kubectl get nodes -o wide
          echo
          kubectl get nodes -o custom-columns='NODE:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,REASON:.status.conditions[?(@.type=="Ready")].reason,LAST-HEARTBEAT:.status.conditions[?(@.type=="Ready")].lastHeartbeatTime,MEM-PRESSURE:.status.conditions[?(@.type=="MemoryPressure")].status,DISK-PRESSURE:.status.conditions[?(@.type=="DiskPressure")].status,TAINTS:.spec.taints[*].key'
          echo
          kubectl get nodes -o custom-columns='NODE:.metadata.name,LABELS:.metadata.labels' | sed 's/map\[//; s/\]//; s/ /\n        /g'

      - name: Pods that are not Running, with events
        continue-on-error: true
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl get pods -A -o wide | grep -vE ' (Running|Completed) ' || true
          echo
          for p in $(kubectl -n "$NS" get pods -o json | jq -r '.items[] | select(.status.phase != "Running" or .metadata.deletionTimestamp != null) | .metadata.name'); do
            echo "=================== $p ==================="
            kubectl -n "$NS" describe pod "$p" | sed -n '/^Node:/p; /^Status:/p; /^Reason:/p; /^Events:/,$p'
            echo
          done

      - name: Volumes and where they live
        continue-on-error: true
        run: |
          kubectl get pv -o custom-columns='PV:.metadata.name,CLAIM:.spec.claimRef.namespace/.spec.claimRef.name,NODE-AFFINITY:.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0],PHASE:.status.phase,SIZE:.spec.capacity.storage'
          echo
          kubectl get pvc -A

      - name: Recent events
        continue-on-error: true
        run: kubectl get events -A --sort-by=.lastTimestamp | tail -45
      - name: itineris admin (startup + background jobs; filtered, identities hidden)
        run: kubectl -n apps logs deploy/itineris-admin --tail=200 2>/dev/null | grep -E '^itineris admin on|backfill|places|looked up' | sed -E 's/allowlist=.*/allowlist=(hidden)/' || true

      - name: Resource usage
        run: |
          kubectl top nodes || true
          echo
          kubectl describe nodes | grep -A8 '^Allocated resources:' || true
